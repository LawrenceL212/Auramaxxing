<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Shadow World</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#03050a; color:#e0e8ff; font-family:'Courier New',monospace; overflow:hidden; height:100vh; }
  canvas { display:block; }
  #hud-top { position:fixed; top:0; left:0; right:0; padding:12px 16px; display:flex; justify-content:space-between; align-items:flex-start; pointer-events:none; z-index:10; }
  #world-title { font-size:16px; letter-spacing:0.15em; color:#61a5ff; text-shadow:0 0 20px rgba(61,165,255,0.6); }
  #world-sub { font-size:9px; color:rgba(61,165,255,0.4); letter-spacing:0.2em; margin-top:2px; }
  #army-hud { display:flex; flex-direction:column; gap:3px; }
  .army-pill { display:flex; align-items:center; gap:6px; padding:3px 8px; background:rgba(5,7,13,0.85); border:1px solid rgba(61,165,255,0.1); border-radius:20px; font-size:10px; }
  .army-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
  .army-count { color:#61a5ff; font-weight:700; }
  #country-panel { position:fixed; bottom:0; left:0; right:0; transform:translateY(100%); transition:transform 0.35s cubic-bezier(0.16,1,0.3,1); background:rgba(5,7,13,0.97); border-top:1px solid rgba(61,165,255,0.15); border-radius:20px 20px 0 0; padding:20px; z-index:20; max-height:55vh; overflow-y:auto; }
  #country-panel.open { transform:translateY(0); }
  #panel-handle { width:36px; height:3px; background:rgba(61,165,255,0.2); border-radius:2px; margin:0 auto 14px; }
  #panel-continent { font-size:9px; letter-spacing:0.15em; margin-bottom:4px; }
  #panel-country { font-size:20px; font-weight:700; margin-bottom:4px; }
  #panel-owner { font-size:11px; color:rgba(61,165,255,0.5); margin-bottom:12px; }
  #panel-soldiers { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .soldier-card { padding:8px 12px; background:rgba(61,165,255,0.05); border:1px solid rgba(61,165,255,0.1); border-radius:8px; text-align:center; min-width:70px; }
  .soldier-num { font-size:16px; font-weight:800; }
  .soldier-label { font-size:9px; color:rgba(61,165,255,0.4); margin-top:2px; }
  #panel-actions { display:flex; gap:8px; }
  .panel-btn { flex:1; padding:12px; border-radius:8px; font-family:'Courier New',monospace; font-size:12px; cursor:pointer; border:none; }
  .btn-claim { background:rgba(61,165,255,0.12); border:1px solid rgba(61,165,255,0.3); color:#61a5ff; }
  .btn-attack { background:rgba(255,61,90,0.1); border:1px solid rgba(255,61,90,0.3); color:#ff3d5a; }
  .btn-reinforce { background:rgba(78,205,120,0.08); border:1px solid rgba(78,205,120,0.25); color:#4ecd78; }
  #panel-close { position:absolute; top:14px; right:16px; background:none; border:none; color:rgba(61,165,255,0.4); font-size:18px; cursor:pointer; }
  #tooltip { position:fixed; pointer-events:none; background:rgba(5,7,13,0.92); border:1px solid rgba(61,165,255,0.2); border-radius:6px; padding:5px 10px; font-size:11px; color:#61a5ff; z-index:30; display:none; }
  #hint { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); font-size:9px; color:rgba(61,165,255,0.18); letter-spacing:0.1em; pointer-events:none; white-space:nowrap; }
  #loading { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#03050a; z-index:50; flex-direction:column; gap:12px; }
  #loading-text { font-family:'Courier New',monospace; font-size:12px; color:rgba(61,165,255,0.5); letter-spacing:0.2em; }
  .loading-bar { width:200px; height:2px; background:rgba(61,165,255,0.1); border-radius:1px; }
  .loading-fill { height:100%; background:#61a5ff; border-radius:1px; transition:width 0.3s; }
</style>
</head>
<body>
<div id="loading">
  <div id="loading-text">◈ INITIALISING SHADOW WORLD</div>
  <div class="loading-bar"><div class="loading-fill" id="load-fill" style="width:0%"></div></div>
</div>

<canvas id="c"></canvas>

<div id="hud-top">
  <div>
    <div id="world-title">◈ SHADOW WORLD</div>
    <div id="world-sub">TERRITORIAL COMMAND</div>
  </div>
  <div id="army-hud"></div>
</div>

<div id="tooltip"></div>
<div id="hint">DRAG TO ROTATE · TAP TERRITORY TO COMMAND</div>

<div id="country-panel">
  <div id="panel-handle"></div>
  <button id="panel-close" onclick="closePanel()">✕</button>
  <div id="panel-continent"></div>
  <div id="panel-country"></div>
  <div id="panel-owner"></div>
  <div id="panel-soldiers"></div>
  <div id="panel-actions"></div>
</div>

<script type="module">
import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.min.js';

// ── Progress ──
const fill = document.getElementById('load-fill');
const setProgress = p => { fill.style.width = p + '%'; };

// ── CONTINENT DEFINITIONS ──
const CONTINENT_META = {
  northAmerica: { name:'Iron Highlands',  stat:'strength',    hex:'#e05555', threeColor:0xe05555, emissive:0x661515 },
  southAmerica: { name:'Wild Summit',     stat:'flexibility', hex:'#22c55e', threeColor:0x22c55e, emissive:0x0a3d1a },
  europe:       { name:'Court Arena',     stat:'combat',      hex:'#f59e0b', threeColor:0xf59e0b, emissive:0x4a2e00 },
  africa:       { name:'Swift Plains',    stat:'agility',     hex:'#38bdf8', threeColor:0x38bdf8, emissive:0x0c3a50 },
  asia:         { name:'Shadow Reaches',  stat:'focus',       hex:'#a78bfa', threeColor:0xa78bfa, emissive:0x2d1a60 },
  australia:    { name:'Tide Depths',     stat:'endurance',   hex:'#2dd4bf', threeColor:0x2dd4bf, emissive:0x0a3530 },
  antarctica:   { name:'The Gate',        stat:'all',         hex:'#cbd5e1', threeColor:0xcbd5e1, emissive:0x1e2a3a },
};

// Countries per continent with approximate positions
const CONTINENT_COUNTRIES = {
  northAmerica: [
    { name:'Ironforge',    lat:60,  lon:-120, isCapital:true  },
    { name:'Steelhold',    lat:47,  lon:-100, isCapital:false },
    { name:'Ashvault',     lat:38,  lon:-98,  isCapital:false },
    { name:'Cinder Keep',  lat:32,  lon:-110, isCapital:false },
    { name:'Brutholm',     lat:52,  lon:-80,  isCapital:false },
    { name:'Forgepeak',    lat:35,  lon:-75,  isCapital:false },
  ],
  southAmerica: [
    { name:'Verdant Peak', lat:-5,  lon:-60,  isCapital:true  },
    { name:'Thornveil',    lat:-15, lon:-55,  isCapital:false },
    { name:'Mistclimb',    lat:-25, lon:-50,  isCapital:false },
    { name:'Roothold',     lat:-35, lon:-65,  isCapital:false },
    { name:'Canopy',       lat:5,   lon:-75,  isCapital:false },
    { name:'Highreach',    lat:-45, lon:-68,  isCapital:false },
  ],
  europe: [
    { name:'Ironring',     lat:52,  lon:10,   isCapital:true  },
    { name:'Gauntlet',     lat:48,  lon:16,   isCapital:false },
    { name:'The Pits',     lat:42,  lon:12,   isCapital:false },
    { name:'Strikewood',   lat:50,  lon:3,    isCapital:false },
    { name:'Combatia',     lat:60,  lon:25,   isCapital:false },
    { name:'Blazeguard',   lat:38,  lon:22,   isCapital:false },
  ],
  africa: [
    { name:'Galerun',      lat:15,  lon:15,   isCapital:true  },
    { name:'Stormstep',    lat:5,   lon:25,   isCapital:false },
    { name:'Blitzfield',   lat:-15, lon:25,   isCapital:false },
    { name:'Vantrace',     lat:0,   lon:35,   isCapital:false },
    { name:'Windfall',     lat:25,  lon:20,   isCapital:false },
    { name:'Rushgate',     lat:-25, lon:25,   isCapital:false },
  ],
  asia: [
    { name:'Voidmark',     lat:45,  lon:75,   isCapital:true  },
    { name:'Umbra',        lat:30,  lon:80,   isCapital:false },
    { name:'The Hollow',   lat:20,  lon:100,  isCapital:false },
    { name:'Phantom Spire',lat:55,  lon:100,  isCapital:false },
    { name:'Eclipse',      lat:35,  lon:105,  isCapital:false },
    { name:'Shadowmere',   lat:60,  lon:130,  isCapital:false },
  ],
  australia: [
    { name:'Deepholm',     lat:-25, lon:130,  isCapital:true  },
    { name:'Abyssal',      lat:-32, lon:145,  isCapital:false },
    { name:'Coralspire',   lat:-20, lon:145,  isCapital:false },
    { name:'Drifthaven',   lat:-28, lon:115,  isCapital:false },
    { name:'Tidemark',     lat:-35, lon:138,  isCapital:false },
    { name:'Undertow',     lat:-15, lon:132,  isCapital:false },
  ],
  antarctica: [
    { name:'Gate Prime',   lat:-82, lon:0,    isCapital:true  },
    { name:'The Threshold',lat:-80, lon:60,   isCapital:false },
    { name:'Nexus',        lat:-80, lon:120,  isCapital:false },
    { name:'The Crossing', lat:-80, lon:180,  isCapital:false },
    { name:'Voidgate',     lat:-80, lon:-120, isCapital:false },
    { name:'The Rift',     lat:-80, lon:-60,  isCapital:false },
  ],
};

// Mock ownership
const OWNERSHIP = {
  northAmerica_0: { owner:'Lawrence', ownerColor:0xd4a017, soldiers:340 },
  northAmerica_1: { owner:'Lawrence', ownerColor:0xd4a017, soldiers:280 },
  northAmerica_2: { owner:'Lucas',    ownerColor:0x38bdf8, soldiers:35  },
  asia_0:         { owner:'LuChing',  ownerColor:0xa78bfa, soldiers:890 },
  asia_1:         { owner:'LuChing',  ownerColor:0xa78bfa, soldiers:650 },
  asia_2:         { owner:'Lucas',    ownerColor:0x38bdf8, soldiers:280 },
  africa_0:       { owner:'Mireyah',  ownerColor:0xff6b9d, soldiers:45  },
};

const PLAYER_ARMIES = {
  Lawrence: { color:'#d4a017', armies:{ northAmerica:1847, southAmerica:48, africa:340, europe:0, asia:12, australia:0, antarctica:0 }},
};

// ── Continent classifier ──
function classifyLonLat(lon, lat) {
  if (lat < -60) return 'antarctica';
  if (lon >= 112 && lat < -10) return 'australia';
  if (lon >= 60 && lat >= -10) return 'asia';
  if (lon >= 25 && lon < 60 && lat >= 35) return 'europe';
  if (lon >= -20 && lon < 55 && lat < 35) return 'africa';
  if (lon < -30 && lat >= 8) return 'northAmerica';
  if (lon < -30 && lat < 8) return 'southAmerica';
  if (lon >= -20 && lon < 25 && lat >= 35) return 'europe';
  return 'asia';
}

// ── THREE SETUP ──
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
camera.position.z = 3.2;

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
}
resize();
window.addEventListener('resize', resize);

// Lighting
scene.add(new THREE.AmbientLight(0x112244, 1.1));
const sun = new THREE.DirectionalLight(0x6699ff, 1.5);
sun.position.set(5, 3, 5);
scene.add(sun);
const rim = new THREE.DirectionalLight(0x0a1533, 0.8);
rim.position.set(-4, -2, -4);
scene.add(rim);

// Stars
const sp = new Float32Array(3000*3);
for (let i=0;i<sp.length;i++) sp[i]=(Math.random()-.5)*90;
const sg = new THREE.BufferGeometry();
sg.setAttribute('position', new THREE.BufferAttribute(sp,3));
scene.add(new THREE.Points(sg, new THREE.PointsMaterial({color:0x7788bb, size:0.03, transparent:true, opacity:0.55})));

const globeGroup = new THREE.Group();
scene.add(globeGroup);

// Ocean
globeGroup.add(new THREE.Mesh(
  new THREE.SphereGeometry(1, 64, 64),
  new THREE.MeshStandardMaterial({ color:0x020a18, roughness:0.9, metalness:0.1, emissive:0x040d22, emissiveIntensity:0.6 })
));

// Atmosphere
scene.add(new THREE.Mesh(
  new THREE.SphereGeometry(1.07, 32, 32),
  new THREE.MeshStandardMaterial({ color:0x1144cc, transparent:true, opacity:0.06, side:THREE.FrontSide, depthWrite:false })
));

// Grid lines
const gm = new THREE.LineBasicMaterial({ color:0x0d1e36, transparent:true, opacity:0.4 });
function ll2v(lat, lon, r=1) {
  const phi = (90-lat)*Math.PI/180, theta=(lon+180)*Math.PI/180;
  return new THREE.Vector3(-r*Math.sin(phi)*Math.cos(theta), r*Math.cos(phi), r*Math.sin(phi)*Math.sin(theta));
}
for (let lat=-75;lat<=75;lat+=15) {
  const pts=[]; for(let lon=0;lon<=360;lon+=3) pts.push(ll2v(lat,lon,1.001));
  globeGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),gm));
}
for (let lon=0;lon<360;lon+=30) {
  const pts=[]; for(let lat=-90;lat<=90;lat+=3) pts.push(ll2v(lat,lon,1.001));
  globeGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),gm));
}

setProgress(20);

// ── Load GeoJSON and build land meshes ──
const geoRes = await fetch('./ne_110m_land.geojson');
const geoData = await geoRes.json();
setProgress(50);

const countryDots = [];

// Build land meshes from real polygons
geoData.features.forEach(feature => {
  const coords = feature.geometry.coordinates[0]; // outer ring
  if (!coords || coords.length < 3) return;

  // Classify this polygon
  const lons = coords.map(c=>c[0]);
  const lats = coords.map(c=>c[1]);
  const cLon = lons.reduce((a,b)=>a+b,0)/lons.length;
  const cLat = lats.reduce((a,b)=>a+b,0)/lats.length;
  const ckey = classifyLonLat(cLon, cLat);
  const meta = CONTINENT_META[ckey];
  if (!meta) return;

  // Build triangle fan from centroid
  const R = 1.003;
  const positions = [];
  const center = ll2v(cLat, cLon, R);

  for (let i=0; i<coords.length-1; i++) {
    const a = ll2v(coords[i][1],   coords[i][0],   R);
    const b = ll2v(coords[i+1][1], coords[i+1][0], R);
    positions.push(center.x, center.y, center.z);
    positions.push(a.x, a.y, a.z);
    positions.push(b.x, b.y, b.z);
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.computeVertexNormals();

  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
    color: meta.threeColor,
    emissive: meta.emissive,
    emissiveIntensity: 0.45,
    roughness: 0.65,
    metalness: 0.08,
    side: THREE.DoubleSide,
  }));
  mesh.userData = { type:'land', ckey };
  globeGroup.add(mesh);
});

setProgress(75);

// ── Country dots & capitals ──
Object.entries(CONTINENT_COUNTRIES).forEach(([ckey, countries]) => {
  const meta = CONTINENT_META[ckey];
  countries.forEach((country, i) => {
    const ownerKey = `${ckey}_${i}`;
    const ownership = OWNERSHIP[ownerKey];
    const isOwned = !!ownership;
    const dotColor = isOwned ? ownership.ownerColor : 0x1a2a44;
    const size = country.isCapital ? 0.048 : 0.032;

    const dot = new THREE.Mesh(
      new THREE.SphereGeometry(size, 10, 10),
      new THREE.MeshStandardMaterial({
        color: dotColor,
        emissive: isOwned ? dotColor : 0x08111e,
        emissiveIntensity: isOwned ? 1.0 : 0.12,
        roughness: 0.2, metalness: 0.7,
      })
    );
    dot.position.copy(ll2v(country.lat, country.lon, 1.024));
    dot.userData = { type:'country', ckey, index:i, ...country, owner:ownership?.owner||null, ownerColor:ownership?.ownerColor||null, soldiers:ownership?.soldiers||0 };
    globeGroup.add(dot);
    countryDots.push(dot);

    // Capital ring
    if (country.isCapital) {
      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(0.062, 0.006, 8, 20),
        new THREE.MeshStandardMaterial({ color:meta.threeColor, emissive:meta.threeColor, emissiveIntensity:1.5 })
      );
      ring.position.copy(ll2v(country.lat, country.lon, 1.024));
      ring.lookAt(0,0,0);
      globeGroup.add(ring);
    }

    // Soldier pillar
    if (ownership?.soldiers > 0) {
      const h = Math.min(Math.log10(ownership.soldiers+1)*0.052, 0.2);
      const pos = ll2v(country.lat, country.lon, 1.024);
      const norm = pos.clone().normalize();
      const pillar = new THREE.Mesh(
        new THREE.CylinderGeometry(0.009,0.013,h,6),
        new THREE.MeshStandardMaterial({ color:dotColor, emissive:dotColor, emissiveIntensity:0.8 })
      );
      pillar.position.copy(pos.clone().add(norm.clone().multiplyScalar(h/2)));
      pillar.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), norm);
      globeGroup.add(pillar);
    }
  });
});

setProgress(90);

// Continent label sprites
function makeLabel(text, hex) {
  const c2 = document.createElement('canvas');
  c2.width=256; c2.height=56;
  const ctx=c2.getContext('2d');
  ctx.font='bold 14px Courier New';
  ctx.fillStyle=hex;
  ctx.textAlign='center';
  ctx.shadowColor=hex;
  ctx.shadowBlur=10;
  ctx.fillText(text,128,34);
  const sprite=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c2),transparent:true,depthWrite:false}));
  sprite.scale.set(0.55,0.12,1);
  return sprite;
}

const CENTERS = { northAmerica:[47,-100], southAmerica:[-15,-58], europe:[50,14], africa:[2,22], asia:[38,82], australia:[-26,134], antarctica:[-78,0] };
Object.entries(CONTINENT_META).forEach(([ckey, meta]) => {
  const [lat,lon] = CENTERS[ckey];
  const label = makeLabel(meta.name, meta.hex);
  label.position.copy(ll2v(lat, lon, 1.13));
  globeGroup.add(label);
});

setProgress(100);
setTimeout(() => { document.getElementById('loading').style.display='none'; }, 300);

// ── RAYCASTER ──
const raycaster = new THREE.Raycaster();
const mouse2 = new THREE.Vector2();
function getHits(cx, cy) {
  mouse2.x=(cx/innerWidth)*2-1; mouse2.y=-(cy/innerHeight)*2+1;
  raycaster.setFromCamera(mouse2, camera);
  return raycaster.intersectObjects(countryDots);
}

// ── DRAG / ROTATE ──
let drag=false, px=0, py=0, vx=0, vy=0, ts=null;
canvas.addEventListener('mousedown', e=>{drag=true;px=e.clientX;py=e.clientY;vx=vy=0;});
canvas.addEventListener('mousemove', e=>{
  if(drag){const dx=e.clientX-px,dy=e.clientY-py; globeGroup.rotation.y+=dx*.005; globeGroup.rotation.x=Math.max(-1.2,Math.min(1.2,globeGroup.rotation.x+dy*.005)); vx=dy*.005;vy=dx*.005;px=e.clientX;py=e.clientY;}
  // tooltip
  const hits=getHits(e.clientX,e.clientY);
  const tt=document.getElementById('tooltip');
  if(hits.length&&hits[0].object.userData.type==='country'){
    const d=hits[0].object.userData;
    tt.style.display='block'; tt.style.left=(e.clientX+12)+'px'; tt.style.top=(e.clientY-28)+'px';
    tt.textContent=d.name+(d.owner?' · '+d.owner:' · Unclaimed');
  } else tt.style.display='none';
});
canvas.addEventListener('mouseup', e=>{if(!drag)return;drag=false;const hits=getHits(e.clientX,e.clientY);if(hits.length&&hits[0].object.userData.type==='country')openPanel(hits[0].object.userData);});

canvas.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];drag=true;ts={x:t.clientX,y:t.clientY};px=t.clientX;py=t.clientY;vx=vy=0;},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();if(!drag)return;const t=e.touches[0],dx=t.clientX-px,dy=t.clientY-py;globeGroup.rotation.y+=dx*.005;globeGroup.rotation.x=Math.max(-1.2,Math.min(1.2,globeGroup.rotation.x+dy*.005));vx=dy*.005;vy=dx*.005;px=t.clientX;py=t.clientY;},{passive:false});
canvas.addEventListener('touchend',e=>{if(!drag)return;drag=false;const t=e.changedTouches[0];if(Math.abs(t.clientX-(ts?.x||0))<8&&Math.abs(t.clientY-(ts?.y||0))<8){const hits=getHits(t.clientX,t.clientY);if(hits.length&&hits[0].object.userData.type==='country')openPanel(hits[0].object.userData);}});

// ── PANEL ──
function openPanel(d) {
  const meta=CONTINENT_META[d.ckey];
  const el=document.getElementById('country-panel');
  const pc=document.getElementById('panel-continent');
  pc.textContent=`◈ ${meta.name.toUpperCase()} · ${meta.stat.toUpperCase()}`;
  pc.style.color=meta.hex;
  const pco=document.getElementById('panel-country');
  pco.textContent=(d.isCapital?'★ ':'')+d.name;
  pco.style.color=d.owner?'#'+((d.ownerColor||0x61a5ff).toString(16).padStart(6,'0')):'#61a5ff';
  document.getElementById('panel-owner').textContent=d.owner?`Controlled by ${d.owner} · ${d.soldiers.toLocaleString()} soldiers`:`Unclaimed — Train ${meta.stat} to build your army here`;
  const se=document.getElementById('panel-soldiers');
  se.innerHTML=d.soldiers>0?`<div class="soldier-card"><div class="soldier-num" style="color:#61a5ff;">${d.soldiers.toLocaleString()}</div><div class="soldier-label">STATIONED</div></div><div class="soldier-card"><div class="soldier-num" style="color:${meta.hex};">${d.isCapital?'×2':'×1'} AP</div><div class="soldier-label">${d.isCapital?'CAPITAL':'INCOME'}</div></div>`:`<div style="font-size:12px;color:rgba(61,165,255,0.4);">No army. Train ${meta.stat} to generate soldiers.</div>`;
  const ae=document.getElementById('panel-actions');
  if(!d.owner) ae.innerHTML=`<button class="panel-btn btn-claim" onclick="closePanel()">⚑ Train to Claim</button>`;
  else if(d.owner==='Lawrence') ae.innerHTML=`<button class="panel-btn btn-reinforce" onclick="closePanel()">⬆ Reinforce</button>`;
  else ae.innerHTML=`<button class="panel-btn btn-attack" onclick="closePanel()">⚔ Declare War</button>`;
  el.classList.add('open');
}
window.closePanel=()=>document.getElementById('country-panel').classList.remove('open');

// Army HUD
const armyHud=document.getElementById('army-hud');
Object.entries(PLAYER_ARMIES.Lawrence.armies).forEach(([ckey,count])=>{
  if(!count)return;
  const meta=CONTINENT_META[ckey];
  const pill=document.createElement('div');
  pill.className='army-pill';
  pill.innerHTML=`<div class="army-dot" style="background:${meta.hex};"></div><span style="color:rgba(61,165,255,0.4);font-size:9px;">${meta.name.split(' ')[0]}</span><span class="army-count">${count.toLocaleString()}</span>`;
  armyHud.appendChild(pill);
});

// ── ANIMATE ──
let t=0;
(function animate(){
  requestAnimationFrame(animate); t+=0.012;
  if(!drag){globeGroup.rotation.y+=vy;globeGroup.rotation.x+=vx;vx*=0.94;vy*=0.94;if(Math.abs(vy)<0.0004)globeGroup.rotation.y+=0.0007;}
  countryDots.forEach((m,i)=>{if(m.userData.owner)m.material.emissiveIntensity=0.7+Math.sin(t*2+i)*0.28;});
  renderer.render(scene,camera);
})();
</script>
