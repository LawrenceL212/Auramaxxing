// ── CANVAS ──
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const W = 2048, H = 1024;
canvas.width = W; canvas.height = H;

function ll2px(lon, lat) {
  return [(lon + 180) / 360 * W, (90 - lat) / 180 * H];
}

// Trace a GeoJSON ring onto the current path
function tracePoly(ring) {
  if (!ring || ring.length < 2) return;
  let first = true, px = null;
  ring.forEach(([lon, lat]) => {
    const [x, y] = ll2px(lon, lat);
    if (first) { ctx.moveTo(x, y); first = false; }
    else if (px !== null && Math.abs(x - px) > W / 2) ctx.moveTo(x, y); // antimeridian
    else ctx.lineTo(x, y);
    px = x;
  });
  ctx.closePath();
}

// Fill a specific polygon index with a colour
function fillPoly(idx, fillStyle) {
  const ring = LAND_POLYS[idx];
  if (!ring) return;
  ctx.beginPath();
  tracePoly(ring);
  ctx.fillStyle = fillStyle;
  ctx.fill();
}

// Fill a zone clipped from mega-polygon 95 or 112
function fillMegaZone(megaIdx, zone, fillStyle) {
  const ring = LAND_POLYS[megaIdx];
  if (!ring) return;

  ctx.save();

  // Clip 1: geographic bounding box
  const [x0, y0] = ll2px(zone.minLon, zone.maxLat);
  const [x1, y1] = ll2px(zone.maxLon, zone.minLat);
  ctx.beginPath();
  ctx.rect(x0, y0, x1 - x0, y1 - y0);
  ctx.clip();

  // Clip 2: actual coastline of the mega polygon
  ctx.beginPath();
  tracePoly(ring);
  ctx.clip();

  // Fill the clipped region
  ctx.fillStyle = fillStyle;
  ctx.fillRect(x0 - 2, y0 - 2, x1 - x0 + 4, y1 - y0 + 4);

  ctx.restore();
}

setP(40);

// ── DRAW ──
function draw() {
  ctx.clearRect(0, 0, W, H);

  // Ocean
  ctx.fillStyle = '#020e1c';
  ctx.fillRect(0, 0, W, H);

  // Grid
  ctx.strokeStyle = 'rgba(61,165,255,0.06)';
  ctx.lineWidth = 0.5;
  for (let lat = -75; lat <= 75; lat += 15) {
    const [, y] = ll2px(0, lat);
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  for (let lon = -180; lon <= 180; lon += 30) {
    const [x] = ll2px(lon, 0);
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }

  // ── Step 1: All land in dark base ──
  ctx.fillStyle = '#0c1e2e';
  ctx.strokeStyle = 'rgba(61,165,255,0.18)';
  ctx.lineWidth = 0.7;
  LAND_POLYS.forEach(ring => {
    ctx.beginPath(); tracePoly(ring); ctx.fill(); ctx.stroke();
  });

  // ── Step 2: Draw each owned country using its exact polygon shapes ──
  COUNTRIES.forEach(c => {
    if (!c.owner) return;
    const p = PLAYERS[c.owner];
    const fill = `rgba(${p.r},${p.g},${p.b},0.88)`;

    // Draw direct polygons
    (c.polys || []).forEach(idx => fillPoly(idx, fill));

    // Draw mega-polygon zones
    if (c.zone95)  fillMegaZone(95,  c.zone95,  fill);
    if (c.zone112) fillMegaZone(112, c.zone112, fill);
  });

  // ── Step 3: Coastline borders on top ──
  ctx.strokeStyle = 'rgba(61,165,255,0.22)';
  ctx.lineWidth = 0.7;
  LAND_POLYS.forEach(ring => {
    ctx.beginPath(); tracePoly(ring); ctx.stroke();
  });

  // ── Step 4: Continent labels ──
  const CC = {northAmerica:[42,-100],southAmerica:[-20,-58],europe:[54,14],africa:[5,20],asia:[42,82],australia:[-28,134],antarctica:[-78,0]};
  Object.entries(CONT).forEach(([k, m]) => {
    const [lat, lon] = CC[k];
    const [x, y] = ll2px(lon, lat);
    ctx.font = '11px Courier New';
    ctx.fillStyle = m.hex + '66';
    ctx.textAlign = 'center';
    ctx.fillText(m.name.toUpperCase(), x, y);
  });

  // ── Step 5: Country markers ──
  COUNTRIES.forEach(c => {
    const [x, y] = ll2px(c.lon, c.lat);
    const p = c.owner ? PLAYERS[c.owner] : null;

    // Glow
    if (p) {
      const g = ctx.createRadialGradient(x, y, 0, x, y, 14);
      g.addColorStop(0, `rgba(${p.r},${p.g},${p.b},0.4)`);
      g.addColorStop(1, 'transparent');
      ctx.beginPath(); ctx.arc(x, y, 14, 0, Math.PI*2);
      ctx.fillStyle = g; ctx.fill();
    }

    // Dot
    ctx.beginPath();
    ctx.arc(x, y, c.isCapital ? 7 : 5, 0, Math.PI*2);
    ctx.fillStyle   = p ? `rgba(${p.r},${p.g},${p.b},1)` : 'rgba(20,50,80,0.8)';
    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.lineWidth   = c.isCapital ? 2 : 1.2;
    ctx.fill(); ctx.stroke();

    // Star
    if (c.isCapital) {
      ctx.font = '9px Arial'; ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
      ctx.fillText('★', x, y + 3.5);
    }

    // Soldier bar
    if (c.soldiers > 0 && p) {
      const h = Math.min(Math.log10(c.soldiers + 1) * 9, 34);
      ctx.fillStyle = `rgba(${p.r},${p.g},${p.b},0.9)`;
      ctx.fillRect(x - 2, y - h - 10, 4, h);
      ctx.strokeStyle = 'rgba(255,255,255,0.35)';
      ctx.lineWidth = 0.5;
      ctx.strokeRect(x - 2, y - h - 10, 4, h);
    }

    // Label
    if (p) {
      ctx.font = `${c.isCapital ? 'bold 10px' : '9px'} Courier New`;
      ctx.textAlign = 'left';
      ctx.strokeStyle = 'rgba(0,0,0,0.9)'; ctx.lineWidth = 3;
      ctx.strokeText(c.name, x + 9, y + 4);
      ctx.fillStyle = `rgba(${p.r},${p.g},${p.b},1)`;
      ctx.fillText(c.name, x + 9, y + 4);
    }
  });
}

draw();
setP(90);

// ── PAN + ZOOM ──
let tx = 0, ty = 0, sc = 1;
function applyT() {
  canvas.style.transformOrigin = '0 0';
  canvas.style.transform = `translate(${tx}px,${ty}px) scale(${sc})`;
}
function resetView() {
  sc = Math.min(innerWidth / W, innerHeight / H);
  tx = (innerWidth  - W * sc) / 2;
  ty = (innerHeight - H * sc) / 2;
  applyT();
}
resetView();
window.resetView = resetView;
window.doZoom = d => {
  const ns = Math.max(0.4, Math.min(6, sc + d));
  tx = innerWidth/2  - (innerWidth/2  - tx) * (ns/sc);
  ty = innerHeight/2 - (innerHeight/2 - ty) * (ns/sc);
  sc = ns; applyT();
};

const wrap = document.getElementById('wrap');
wrap.addEventListener('wheel', e => {
  e.preventDefault();
  const ns = Math.max(0.4, Math.min(6, sc + (e.deltaY < 0 ? 0.15 : -0.15)));
  tx = e.clientX - (e.clientX - tx)*(ns/sc);
  ty = e.clientY - (e.clientY - ty)*(ns/sc);
  sc = ns; applyT();
}, {passive:false});

let drag=false, ds={x:0,y:0}, dt={x:0,y:0}, moved=false;
wrap.addEventListener('mousedown', e => { drag=true; moved=false; ds={x:e.clientX,y:e.clientY}; dt={x:tx,y:ty}; wrap.classList.add('drag'); });
wrap.addEventListener('mousemove', e => {
  if (drag) { const dx=e.clientX-ds.x,dy=e.clientY-ds.y; if(Math.abs(dx)+Math.abs(dy)>4) moved=true; tx=dt.x+dx; ty=dt.y+dy; applyT(); }
  updateTT(e.clientX, e.clientY);
});
wrap.addEventListener('mouseup', e => { wrap.classList.remove('drag'); if(!moved) onClick(e.clientX,e.clientY); drag=false; });

let ld=0;
wrap.addEventListener('touchstart', e=>{e.preventDefault();moved=false;if(e.touches.length===1){const t=e.touches[0];drag=true;ds={x:t.clientX,y:t.clientY};dt={x:tx,y:ty};}if(e.touches.length===2)ld=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);},{passive:false});
wrap.addEventListener('touchmove', e=>{e.preventDefault();if(e.touches.length===1&&drag){const t=e.touches[0],dx=t.clientX-ds.x,dy=t.clientY-ds.y;if(Math.abs(dx)+Math.abs(dy)>4)moved=true;tx=dt.x+dx;ty=dt.y+dy;applyT();}if(e.touches.length===2){const d2=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);const ns=Math.max(0.4,Math.min(6,sc+(d2-ld)*0.005));const cx=(e.touches[0].clientX+e.touches[1].clientX)/2,cy=(e.touches[0].clientY+e.touches[1].clientY)/2;tx=cx-(cx-tx)*(ns/sc);ty=cy-(cy-ty)*(ns/sc);sc=ns;ld=d2;applyT();}},{passive:false});
wrap.addEventListener('touchend', e=>{drag=false;if(!moved&&e.changedTouches.length===1)onClick(e.changedTouches[0].clientX,e.changedTouches[0].clientY);});

function mapCoords(sx,sy) { return [(sx-tx)/sc,(sy-ty)/sc]; }

function nearest(sx,sy) {
  const [mx,my]=mapCoords(sx,sy);
  let best=null, bd=Infinity;
  COUNTRIES.forEach(c=>{const[cx,cy]=ll2px(c.lon,c.lat);const d=Math.hypot(mx-cx,my-cy);if(d<bd){bd=d;best=c;}});
  return bd < 30/sc ? best : null;
}

function onClick(sx,sy) { const c=nearest(sx,sy); if(c) openPanel(c); }

function updateTT(sx,sy) {
  const c=nearest(sx,sy);
  const tt=document.getElementById('tt');
  if(c){tt.style.display='block';tt.style.left=(sx+12)+'px';tt.style.top=(sy-28)+'px';tt.textContent=c.name+(c.owner?' · '+c.owner+' · '+c.soldiers.toLocaleString()+' soldiers':' · Unclaimed');}
  else tt.style.display='none';
}

function openPanel(c) {
  const m=CONT[c.ckey]; const p=c.owner?PLAYERS[c.owner]:null;
  const owned=COUNTRIES.filter(x=>x.ckey===c.ckey&&x.owner===c.owner).length;
  document.getElementById('pc').textContent=`◈ ${m.name.toUpperCase()} · ${m.stat.toUpperCase()}`;
  document.getElementById('pc').style.color=m.hex;
  document.getElementById('pn').textContent=(c.isCapital?'★ ':'')+c.name;
  document.getElementById('pn').style.color=p?.hex||'#61a5ff';
  document.getElementById('po').innerHTML=c.owner
    ?`<span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${p.hex};box-shadow:0 0 6px ${p.hex};margin-right:6px;vertical-align:middle;"></span><strong style="color:${p.hex};">${c.owner}</strong> — ${owned}/6 countries in ${m.name}`
    :`Unclaimed — Train ${m.stat} to build your shadow army here`;
  document.getElementById('ps').innerHTML=`
    <div class="sc"><div class="sn" style="color:${p?.hex||'#61a5ff'};">${c.soldiers>0?c.soldiers.toLocaleString():'-'}</div><div class="sl">SOLDIERS</div></div>
    <div class="sc"><div class="sn" style="color:${m.hex};">${c.isCapital?'×2':'×1'} AP</div><div class="sl">${c.isCapital?'CAPITAL':'INCOME'}</div></div>
    <div class="sc"><div class="sn" style="color:${m.hex};">${owned}/6</div><div class="sl">CONTINENT</div></div>`;
  document.getElementById('pa').innerHTML=!c.owner
    ?`<button class="pb bc" onclick="closePanel()">⚑ Train to Claim</button>`
    :c.owner==='Lawrence'
    ?`<button class="pb br" onclick="closePanel()">⬆ Reinforce</button>`
    :`<button class="pb ba" onclick="closePanel()">⚔ Declare War</button>`;
  document.getElementById('panel').classList.add('open');
}
window.closePanel=()=>document.getElementById('panel').classList.remove('open');

setP(100);
setTimeout(()=>document.getElementById('load').style.display='none',200);
window.addEventListener('resize', resetView);
</script>
</body>
