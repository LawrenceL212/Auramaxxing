// ── CANVAS SETUP ──
const canvas = document.getElementById('map');
const ctx    = canvas.getContext('2d');
const MAP_W  = 2048;
const MAP_H  = 1024;
canvas.width  = MAP_W;
canvas.height = MAP_H;

function ll2px(lon, lat) {
  return [(lon + 180) / 360 * MAP_W, (90 - lat) / 180 * MAP_H];
}

function tracePoly(pts) {
  // Trace a polygon path from [lon,lat] array, handling antimeridian
  ctx.beginPath();
  let first = true;
  let prevX = null;
  pts.forEach(([lon, lat]) => {
    const [x, y] = ll2px(lon, lat);
    if (first) { ctx.moveTo(x, y); first = false; }
    else if (prevX !== null && Math.abs(x - prevX) > MAP_W / 2) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
    prevX = x;
  });
  ctx.closePath();
}

// ── BUILD CONTINENT CLIP PATHS ──
// Group land polygons by continent for clipping
function classifyPoly(idx, cLon, cLat) {
  if (cLat < -60) return 'antarctica';
  if (cLon > 110 && cLat < -10) return 'australia';
  if (cLon > 95  && cLat > -10) return 'asia';
  if (cLon > 25  && cLon < 95  && cLat > 30) return 'asia';
  if (cLon > -15 && cLon < 50  && cLat > 34) return 'europe';
  if (cLon > -20 && cLon < 55  && cLat < 34) return 'africa';
  if (cLon < -30 && cLat > 8)  return 'northAmerica';
  if (cLon < -30 && cLat < 8)  return 'southAmerica';
  if (cLon > -20 && cLon < 25  && cLat > 34) return 'europe';
  if (idx === 112) return 'asia';
  return 'asia';
}

const continentPolys = {};
LAND_POLYS.forEach((ring, idx) => {
  if (!ring || ring.length < 3) return;
  const cLon = ring.reduce((s,p)=>s+p[0],0)/ring.length;
  const cLat  = ring.reduce((s,p)=>s+p[1],0)/ring.length;
  const ckey  = classifyPoly(idx, cLon, cLat);
  if (!continentPolys[ckey]) continentPolys[ckey] = [];
  continentPolys[ckey].push(ring);
});

setP(40);

// ── DRAW MAP ──
function drawMap() {
  ctx.clearRect(0, 0, MAP_W, MAP_H);

  // Ocean
  ctx.fillStyle = '#020e1c';
  ctx.fillRect(0, 0, MAP_W, MAP_H);

  // Grid lines
  ctx.strokeStyle = 'rgba(61,165,255,0.07)';
  ctx.lineWidth = 0.5;
  for (let lat=-75;lat<=75;lat+=15) {
    const y=(90-lat)/180*MAP_H;
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(MAP_W,y); ctx.stroke();
  }
  for (let lon=-180;lon<=180;lon+=30) {
    const x=(lon+180)/360*MAP_W;
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,MAP_H); ctx.stroke();
  }

  // ── Step 1: Draw all land in dark base colour ──
  ctx.fillStyle = '#0a1e30';
  ctx.strokeStyle = 'rgba(61,165,255,0.2)';
  ctx.lineWidth = 0.8;
  LAND_POLYS.forEach(ring => {
    if (!ring || ring.length < 3) return;
    tracePoly(ring);
    ctx.fill();
    ctx.stroke();
  });

  // ── Step 2: For each COUNTRY, clip to its continent and fill zone in owner colour ──
  COUNTRIES.forEach(c => {
    if (!c.owner) return;
    const p = PLAYERS[c.owner];

    // Save state
    ctx.save();

    // Build clip from all continent polygons
    const polys = continentPolys[c.ckey] || [];
    if (polys.length === 0) { ctx.restore(); return; }

    // Create clip path from continent land polygons
    ctx.beginPath();
    polys.forEach(ring => tracePoly(ring));
    ctx.clip('evenodd');

    // Now fill the country zone polygon — only visible land shows through
    tracePoly(c.zone);
    ctx.fillStyle = `rgba(${p.r},${p.g},${p.b},0.85)`;
    ctx.fill();

    // Stroke the zone border lightly
    ctx.strokeStyle = `rgba(${p.r},${p.g},${p.b},0.5)`;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.restore();
  });

  // ── Step 3: Re-stroke all continent coastlines on top for clean borders ──
  ctx.strokeStyle = 'rgba(61,165,255,0.25)';
  ctx.lineWidth = 0.8;
  LAND_POLYS.forEach(ring => {
    if (!ring || ring.length < 3) return;
    tracePoly(ring);
    ctx.stroke();
  });

  // ── Step 4: Continent name labels ──
  const CC = {northAmerica:[42,-100],southAmerica:[-20,-58],europe:[56,14],africa:[5,20],asia:[42,80],australia:[-28,134],antarctica:[-78,0]};
  Object.entries(CONT).forEach(([k,m]) => {
    const [lat,lon] = CC[k];
    const [x,y] = ll2px(lon,lat);
    ctx.font = '11px Courier New';
    ctx.fillStyle = m.hex + '88';
    ctx.textAlign = 'center';
    ctx.fillText(m.name.toUpperCase(), x, y);
  });

  // ── Step 5: Country markers ──
  COUNTRIES.forEach(c => {
    const [x,y] = ll2px(c.lon, c.lat);
    const p = c.owner ? PLAYERS[c.owner] : null;

    // Dot
    ctx.beginPath();
    ctx.arc(x, y, c.isCapital ? 7 : 5, 0, Math.PI*2);
    ctx.fillStyle   = p ? `rgba(${p.r},${p.g},${p.b},1)` : 'rgba(20,50,80,0.8)';
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.lineWidth   = c.isCapital ? 2 : 1.2;
    ctx.fill(); ctx.stroke();

    // Capital star
    if (c.isCapital) {
      ctx.font = '9px Arial';
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      ctx.textAlign = 'center';
      ctx.fillText('★', x, y+3.5);
    }

    // Soldier bar
    if (c.soldiers > 0 && p) {
      const h = Math.min(Math.log10(c.soldiers+1)*9, 32);
      ctx.fillStyle = `rgba(${p.r},${p.g},${p.b},0.9)`;
      ctx.fillRect(x-2, y-h-9, 4, h);
      ctx.strokeStyle = 'rgba(255,255,255,0.4)';
      ctx.lineWidth = 0.5;
      ctx.strokeRect(x-2, y-h-9, 4, h);
    }

    // Country name
    if (p) {
      const label = c.name;
      ctx.font = `${c.isCapital?'bold 10px':'9px'} Courier New`;
      ctx.textAlign = 'left';
      ctx.strokeStyle = 'rgba(0,0,0,0.9)';
      ctx.lineWidth = 3;
      ctx.strokeText(label, x+9, y+4);
      ctx.fillStyle = `rgba(${p.r},${p.g},${p.b},1)`;
      ctx.fillText(label, x+9, y+4);
    }
  });
}

drawMap();
setP(80);

function applyT() {
  canvas.style.transformOrigin = '0 0';
  canvas.style.transform = `translate(${tx}px,${ty}px) scale(${sc})`;
}

function resetView() {
  const vw=innerWidth, vh=innerHeight;
  sc = Math.min(vw/MAP_W, vh/MAP_H) * 1.0;
  tx = (vw - MAP_W*sc)/2;
  ty = (vh - MAP_H*sc)/2;
  applyT();
}
resetView();
window.resetView = resetView;

window.zoom = d => {
  const vw=innerWidth, vh=innerHeight;
  const ns = Math.max(MIN_SC, Math.min(MAX_SC, sc+d));
  tx = vw/2 - (vw/2-tx)*(ns/sc);
  ty = vh/2 - (vh/2-ty)*(ns/sc);
  sc = ns; applyT();
};

const wrap = document.getElementById('map-wrap');
wrap.addEventListener('wheel', e => {
  e.preventDefault();
  const d = e.deltaY<0 ? 0.15 : -0.15;
  const ns = Math.max(MIN_SC, Math.min(MAX_SC, sc+d));
  tx = e.clientX - (e.clientX-tx)*(ns/sc);
  ty = e.clientY - (e.clientY-ty)*(ns/sc);
  sc=ns; applyT();
}, {passive:false});

let drag=false, ds={x:0,y:0}, dtx=0, dty=0, moved=false;
wrap.addEventListener('mousedown', e => { drag=true; moved=false; ds={x:e.clientX,y:e.clientY}; dtx=tx; dty=ty; wrap.classList.add('dragging'); });
wrap.addEventListener('mousemove', e => {
  if (drag) { const dx=e.clientX-ds.x,dy=e.clientY-ds.y; if(Math.abs(dx)+Math.abs(dy)>4)moved=true; tx=dtx+dx; ty=dty+dy; applyT(); }
  updateTT(e.clientX, e.clientY);
});
wrap.addEventListener('mouseup', e => { wrap.classList.remove('dragging'); if(!moved)handleClick(e.clientX,e.clientY); drag=false; });

let touches2=[], ld=0;
wrap.addEventListener('touchstart', e => { e.preventDefault(); moved=false; if(e.touches.length===1){const t=e.touches[0];drag=true;ds={x:t.clientX,y:t.clientY};dtx=tx;dty=ty;} if(e.touches.length===2)ld=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY); },{passive:false});
wrap.addEventListener('touchmove', e => {
  e.preventDefault();
  if(e.touches.length===1&&drag){const t=e.touches[0],dx=t.clientX-ds.x,dy=t.clientY-ds.y;if(Math.abs(dx)+Math.abs(dy)>4)moved=true;tx=dtx+dx;ty=dty+dy;applyT();}
  if(e.touches.length===2){const d2=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);const dd=(d2-ld)*0.005;const cx=(e.touches[0].clientX+e.touches[1].clientX)/2,cy=(e.touches[0].clientY+e.touches[1].clientY)/2;const ns=Math.max(MIN_SC,Math.min(MAX_SC,sc+dd));tx=cx-(cx-tx)*(ns/sc);ty=cy-(cy-ty)*(ns/sc);sc=ns;ld=d2;applyT();}
},{passive:false});
wrap.addEventListener('touchend', e => { drag=false; if(!moved&&e.changedTouches.length===1)handleClick(e.changedTouches[0].clientX,e.changedTouches[0].clientY); });

function screenToMap(sx,sy) { return [(sx-tx)/sc,(sy-ty)/sc]; }

function nearestCountry(sx,sy) {
  const [mx,my]=screenToMap(sx,sy);
  let best=null,bd=Infinity;
  COUNTRIES.forEach(c=>{ const [cx,cy]=ll2px(c.lon,c.lat); const d=Math.hypot(mx-cx,my-cy); if(d<bd){bd=d;best=c;} });
  return bd < 25/sc ? best : null;
}

function handleClick(sx,sy) { const c=nearestCountry(sx,sy); if(c)openPanel(c); }

function updateTT(sx,sy) {
  const c=nearestCountry(sx,sy);
  const tt=document.getElementById('tt');
  if(c){tt.style.display='block';tt.style.left=(sx+12)+'px';tt.style.top=(sy-28)+'px';tt.textContent=c.name+(c.owner?' · '+c.owner+(c.soldiers?' · '+c.soldiers.toLocaleString()+' soldiers':''):' · Unclaimed');}
  else tt.style.display='none';
}

function openPanel(c) {
  const m=CONT[c.ckey]; const p=c.owner?PLAYERS[c.owner]:null;
  // Count continent ownership
  const contCountries = COUNTRIES.filter(x=>x.ckey===c.ckey);
  const owned = contCountries.filter(x=>x.owner===c.owner).length;
  document.getElementById('pc').textContent=`◈ ${m.name.toUpperCase()} · ${m.stat.toUpperCase()}`;
  document.getElementById('pc').style.color=m.hex;
  document.getElementById('pn').textContent=(c.isCapital?'★ ':'')+c.name;
  document.getElementById('pn').style.color=p?.hex||'#61a5ff';
  document.getElementById('po').innerHTML=c.owner
    ?`<span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${p.hex};box-shadow:0 0 6px ${p.hex};margin-right:6px;vertical-align:middle;"></span><strong style="color:${p.hex};">${c.owner}</strong> — ${owned}/6 countries in ${m.name}`
    :`Unclaimed — Train ${m.stat} to build your shadow army here`;
  document.getElementById('ps').innerHTML=`
    <div class="sc"><div class="sn" style="color:${p?.hex||'#61a5ff'};">${c.soldiers>0?c.soldiers.toLocaleString():'-'}</div><div class="sl">SOLDIERS</div></div>
    <div class="sc"><div class="sn" style="color:${m.hex};">${c.isCapital?'×2':'×1'} AP</div><div class="sl">${c.isCapital?'CAPITAL':'INCOME'}</div></div>
    <div class="sc"><div class="sn" style="color:${m.hex};">${owned}/6</div><div class="sl">CONTINENT</div></div>`;
  document.getElementById('pa').innerHTML=!c.owner
    ?`<button class="pb bc" onclick="closePanel()">⚑ Train to Claim</button>`
    :c.owner==='Lawrence'
    ?`<button class="pb br" onclick="closePanel()">⬆ Reinforce</button>`
    :`<button class="pb ba" onclick="closePanel()">⚔ Declare War</button>`;
  document.getElementById('panel').classList.add('open');
}
window.closePanel=()=>document.getElementById('panel').classList.remove('open');

setP(100);
setTimeout(()=>document.getElementById('loading').style.display='none',200);
window.addEventListener('resize',resetView);
</script>
</body>
</html>
