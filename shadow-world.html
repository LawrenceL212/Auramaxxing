<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Shadow World</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#020c18; color:#e0e8ff; font-family:'Courier New',monospace; overflow:hidden; height:100vh; }
#wrap { position:relative; width:100vw; height:100vh; overflow:hidden; cursor:grab; }
#wrap.drag { cursor:grabbing; }
canvas { display:block; }

/* ── HUD top ── */
#hud { position:fixed; top:0; left:0; right:0; padding:8px 14px; display:flex; justify-content:space-between; align-items:center; pointer-events:none; z-index:20; background:linear-gradient(180deg,rgba(2,12,24,0.9) 0%,transparent 100%); }
#wt { font-size:13px; letter-spacing:.18em; color:#61a5ff; text-shadow:0 0 16px rgba(61,165,255,.7); }
#ws { font-size:8px; color:rgba(61,165,255,.35); letter-spacing:.2em; margin-top:1px; }

/* ── Army sidebar — right side ── */
#army-sidebar {
  position:fixed; right:0; top:0; bottom:0; width:200px;
  background:rgba(2,12,24,0.92); border-left:1px solid rgba(61,165,255,0.1);
  z-index:25; display:flex; flex-direction:column; overflow-y:auto;
  padding:48px 0 16px;
}
#army-sidebar::-webkit-scrollbar { width:3px; }
#army-sidebar::-webkit-scrollbar-thumb { background:rgba(61,165,255,.2); }
.asi-head { font-size:8px; letter-spacing:.2em; color:rgba(61,165,255,.35); padding:10px 12px 4px; border-bottom:1px solid rgba(61,165,255,.06); margin-bottom:4px; }
.cont-row { padding:7px 12px; cursor:pointer; transition:background .15s; border-bottom:1px solid rgba(61,165,255,.04); }
.cont-row:hover { background:rgba(61,165,255,.05); }
.cont-row:active { background:rgba(61,165,255,.1); }
.cr-name { font-size:10px; font-weight:700; display:flex; align-items:center; gap:5px; margin-bottom:3px; }
.cr-pool { font-size:9px; color:rgba(61,165,255,.4); margin-bottom:3px; }
.cr-pool strong { color:#d4a017; }
.cr-bar { height:3px; background:rgba(61,165,255,.08); border-radius:2px; overflow:hidden; display:flex; gap:1px; }
.cr-seg { height:100%; transition:width .4s; }
.cr-owned { font-size:9px; margin-top:3px; }

/* ── Zoom buttons ── */
#zb { position:fixed; right:212px; bottom:60px; display:flex; flex-direction:column; gap:6px; z-index:26; }
.zb { width:34px; height:34px; background:rgba(2,12,24,0.85); border:1px solid rgba(61,165,255,0.2); border-radius:8px; color:#61a5ff; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; }

/* ── Tooltip ── */
#tt { position:fixed; pointer-events:none; background:rgba(2,12,24,0.95); border:1px solid rgba(61,165,255,0.3); border-radius:6px; padding:5px 10px; font-size:11px; color:#61a5ff; z-index:30; display:none; white-space:nowrap; }

/* ── Bottom panel ── */
#panel { position:fixed; bottom:0; left:0; right:200px; transform:translateY(100%); transition:transform .35s cubic-bezier(.16,1,.3,1); background:rgba(2,12,24,0.98); border-top:1px solid rgba(61,165,255,.15); border-radius:20px 20px 0 0; padding:16px 18px; z-index:30; max-height:55vh; overflow-y:auto; }
#panel.open { transform:translateY(0); }
#ph { width:36px; height:3px; background:rgba(61,165,255,.2); border-radius:2px; margin:0 auto 10px; }
#pc { font-size:9px; letter-spacing:.15em; margin-bottom:2px; }
#pn { font-size:18px; font-weight:700; margin-bottom:2px; }
#po { font-size:11px; color:rgba(61,165,255,.5); margin-bottom:8px; }
#ps { display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
.sc { padding:6px 10px; background:rgba(61,165,255,.05); border:1px solid rgba(61,165,255,.1); border-radius:8px; text-align:center; min-width:65px; }
.sn { font-size:14px; font-weight:800; }
.sl { font-size:8px; color:rgba(61,165,255,.4); margin-top:1px; }
#pa { display:flex; gap:8px; flex-wrap:wrap; }
.pb { flex:1; min-width:100px; padding:9px; border-radius:8px; font-family:'Courier New',monospace; font-size:12px; cursor:pointer; border:none; touch-action:manipulation; }
.bc { background:rgba(61,165,255,.12); border:1px solid rgba(61,165,255,.3); color:#61a5ff; }
.ba { background:rgba(255,61,90,.1); border:1px solid rgba(255,61,90,.3); color:#ff3d5a; }
.br { background:rgba(78,205,120,.08); border:1px solid rgba(78,205,120,.25); color:#4ecd78; }
.bd { background:rgba(212,160,23,.08); border:1px solid rgba(212,160,23,.25); color:#d4a017; }
#px { position:absolute; top:10px; right:12px; background:none; border:none; color:rgba(61,165,255,.4); font-size:18px; cursor:pointer; }
#deploy-row { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
#deploy-row input { background:rgba(61,165,255,.06); border:1px solid rgba(61,165,255,.2); border-radius:8px; color:#e0e8ff; font-family:'Courier New',monospace; font-size:14px; padding:7px 10px; width:72px; text-align:center; }
#pool-info { font-size:11px; color:rgba(61,165,255,.4); margin-bottom:10px; line-height:1.6; }
#cont-progress { margin-bottom:10px; }
#load { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#020c18; z-index:50; gap:14px; }
#lt { font-size:11px; color:rgba(61,165,255,.5); letter-spacing:.2em; }
.lb { width:200px; height:2px; background:rgba(61,165,255,.1); border-radius:1px; }
.lf { height:100%; background:#61a5ff; border-radius:1px; transition:width .2s; }

/* Mobile: sidebar becomes compact horizontal strip at top */
@media (max-width:600px) {
  #army-sidebar {
    width:100%; height:auto; max-height:none;
    top:36px; bottom:auto; right:0; left:0;
    border-left:none; border-top:none; border-bottom:1px solid rgba(61,165,255,.08);
    padding:0; flex-direction:row; flex-wrap:nowrap;
    overflow-x:auto; overflow-y:hidden;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  #army-sidebar::-webkit-scrollbar { display:none; }
  .asi-head { display:none; }
  .cont-row {
    min-width:130px; flex:0 0 130px;
    border-bottom:none; border-right:1px solid rgba(61,165,255,.04);
    padding:6px 10px;
  }
  #zb { right:8px; bottom:12px; }
  #panel { right:0; max-height:60vh; }
}
</style>
</head>
<body>
<div id="load"><div id="lt">◈ LOADING SHADOW WORLD</div><div class="lb"><div class="lf" id="lf" style="width:0%"></div></div></div>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="hud"><div><div id="wt">◈ SHADOW WORLD</div><div id="ws">TERRITORIAL COMMAND</div></div></div>

<!-- Army sidebar -->
<div id="army-sidebar">
  <div class="asi-head">◈ CONTINENTAL ARMIES</div>
  <div id="sidebar-continents"></div>
</div>

<div id="zb">
  <button class="zb" onclick="doZoom(0.3)">+</button>
  <button class="zb" onclick="doZoom(-0.3)">−</button>
  <button class="zb" style="font-size:13px;" onclick="resetView()">⌂</button>
</div>
<div id="tt"></div>
<div id="panel">
  <div id="ph"></div><button id="px" onclick="closePanel()">✕</button>
  <div id="pc"></div>
  <div id="pn"></div>
  <div id="po"></div>
  <div id="cont-progress"></div>
  <div id="ps"></div>
  <div id="pool-info"></div>
  <div id="deploy-row" style="display:none;">
    <input type="number" id="deploy-input" min="1" value="10" />
    <button class="pb bd" id="deploy-btn" style="flex:none;padding:8px 16px;">⚑ Deploy</button>
  </div>
  <div id="pa"></div>
</div>

<script type="module">
import { COUNTRIES_GEO } from './countries_embedded.js';

const setP = p => document.getElementById('lf').style.width = p + '%';

// ── PLAYERS — keyed by UID ──
const PLAYER_COLOR_MAP = {
  'eUtGPwQBcCSO0x3xS3ZGYFGXNIT2': { hex:'#d4a017', r:212, g:160, b:23,  name:'Lawrence' },
  'd1W5vTx5aSTIwkR4CIwnO2xW7vf1': { hex:'#7c3aed', r:124, g:58,  b:237, name:'LuChing'  },
  'rzcznIkNRrSKVXl74LsTaRSdHOk2': { hex:'#0ea5e9', r:14,  g:165, b:233, name:'Lucas'    },

const PLAYERS = { ...PLAYER_COLOR_MAP };

  southAmerica: { name:'Wild Summit',     armyKey:'wild',   stat:'Flexibility', hex:'#22c55e', icon:'🧗' },

const GAME_COUNTRIES = [
  // NORTH AMERICA — Iron Highlands (strength training)

  { id:'sa_1', name:'Thornveil',    ckey:'southAmerica', isCapital:false, lat:-5,  lon:-55,  realCountries:['Brazil'] },
  { id:'sa_2', name:'Mistclimb',    ckey:'southAmerica', isCapital:false, lat:-12, lon:-74,  realCountries:['Peru','Bolivia'] },
  { id:'sa_3', name:'Roothold',     ckey:'southAmerica', isCapital:false, lat:-34, lon:-64,  realCountries:['Argentina','Uruguay','Paraguay'] },
  { id:'sa_4', name:'Canopy',       ckey:'southAmerica', isCapital:false, lat:-18, lon:-70,  realCountries:['Chile'] },
  { id:'sa_5', name:'Highreach',    ckey:'southAmerica', isCapital:false, lat:-52, lon:-68,  realCountries:['Falkland Is.'] },
  // EUROPE — Court Arena (boxing/sports)
  { id:'eu_0', name:'Ironring',     ckey:'europe', isCapital:true,  lat:51, lon:4,   realCountries:['United Kingdom','Ireland','France','Belgium','Netherlands','Luxembourg','Germany','Switzerland','Austria','Denmark','Monaco','Andorra','Liechtenstein','Faeroe Is.','Åland','Guernsey','Jersey','Isle of Man'] },
  { id:'eu_1', name:'Gauntlet',     ckey:'europe', isCapital:false, lat:48, lon:20,  realCountries:['Poland','Czechia','Slovakia','Hungary','Romania','Bulgaria','Serbia','Croatia','Slovenia','Bosnia and Herz.','Albania','North Macedonia','Kosovo','Moldova','Montenegro','San Marino','Vatican'] },
  { id:'eu_2', name:'The Pits',     ckey:'europe', isCapital:false, lat:40, lon:14,  realCountries:['Italy','Spain','Portugal','Greece','Malta','Cyprus','N. Cyprus'] },
  { id:'eu_3', name:'Strikewood',   ckey:'europe', isCapital:false, lat:64, lon:14,  realCountries:['Sweden','Norway','Finland','Iceland'] },

  // AFRICA — Swift Plains (cardio/running)
  { id:'af_0', name:'Galerun',      ckey:'africa', isCapital:true,  lat:18, lon:2,   realCountries:['Morocco','Algeria','Tunisia','Libya','W. Sahara','Mauritania','Mali','Niger','Senegal','Gambia','Guinea-Bissau','Guinea','Sierra Leone','Liberia',"Côte d'Ivoire",'Ghana','Togo','Benin','Nigeria','Burkina Faso','Cabo Verde','Egypt'] },
  { id:'af_1', name:'Stormstep',    ckey:'africa', isCapital:false, lat:8,  lon:25,  realCountries:['Chad','Sudan','S. Sudan','Central African Rep.','Cameroon','Eq. Guinea','Gabon','Congo','Dem. Rep. Congo','Ethiopia','Djibouti','Eritrea','Somalia','Somaliland',"São Tomé and Principe"] },

  { id:'af_3', name:'Vantrace',     ckey:'africa', isCapital:false, lat:-25,lon:25,  realCountries:['Zambia','Zimbabwe','Malawi','Mozambique','Namibia','Botswana','eSwatini','Lesotho'] },
  { id:'af_4', name:'Windfall',     ckey:'africa', isCapital:false, lat:-30,lon:26,  realCountries:['South Africa'] },
  { id:'af_5', name:'Rushgate',     ckey:'africa', isCapital:false, lat:-20,lon:46,  realCountries:['Madagascar','Comoros','Seychelles','Mauritius','Saint Helena'] },
  // ASIA — Shadow Reaches (focus/skill)
  { id:'as_0', name:'Voidmark',     ckey:'asia', isCapital:true,  lat:60, lon:100, realCountries:['Russia','Kazakhstan','Mongolia','Uzbekistan','Turkmenistan','Kyrgyzstan','Tajikistan'] },
  { id:'as_1', name:'Umbra',        ckey:'asia', isCapital:false, lat:28, lon:68,  realCountries:['China','India','Pakistan','Afghanistan','Nepal','Bhutan','Bangladesh','Sri Lanka','Iran','Iraq','Syria','Kuwait','Saudi Arabia','Yemen','Oman','United Arab Emirates','Qatar','Bahrain','Jordan','Lebanon','Israel','Palestine','Macao','Hong Kong','Siachen Glacier','Indian Ocean Ter.'] },
  { id:'as_2', name:'The Hollow',   ckey:'asia', isCapital:false, lat:15, lon:102, realCountries:['Myanmar','Thailand','Vietnam','Laos','Cambodia','Malaysia','Singapore','Indonesia','Brunei','Timor-Leste'] },
  { id:'as_3', name:'Phantom Spire',ckey:'asia', isCapital:false, lat:36, lon:128, realCountries:['Japan','South Korea','North Korea','Taiwan'] },
  { id:'as_4', name:'Eclipse',      ckey:'asia', isCapital:false, lat:12, lon:122, realCountries:['Philippines'] },
  { id:'as_5', name:'Shadowmere',   ckey:'asia', isCapital:false, lat:4,  lon:108, realCountries:[] },
  // AUSTRALIA — Tide Depths (endurance/swimming)
  { id:'au_0', name:'Deepholm',     ckey:'australia', isCapital:true,  lat:-25,lon:130, realCountries:['Australia'] },
  { id:'au_1', name:'Abyssal',      ckey:'australia', isCapital:false, lat:-40,lon:148, realCountries:[] },
  { id:'au_2', name:'Coralspire',   ckey:'australia', isCapital:false, lat:-6, lon:147, realCountries:['Papua New Guinea','Solomon Is.','Vanuatu'] },
  { id:'au_3', name:'Drifthaven',   ckey:'australia', isCapital:false, lat:-14,lon:167, realCountries:['Fiji','Samoa','Tonga','New Caledonia'] },
  { id:'au_4', name:'Tidemark',     ckey:'australia', isCapital:false, lat:-10,lon:160, realCountries:['Micronesia','Palau','Marshall Is.','Kiribati','Nauru','Tuvalu'] },
  { id:'au_5', name:'Undertow',     ckey:'australia', isCapital:false, lat:-38,lon:175, realCountries:['New Zealand'] },
  // ANTARCTICA — The Gate
  { id:'an_0', name:'Gate Prime',   ckey:'antarctica', isCapital:true,  lat:-80,lon:0,    realCountries:['Antarctica'] },
  { id:'an_1', name:'The Threshold',ckey:'antarctica', isCapital:false, lat:-80,lon:60,   realCountries:[] },
  { id:'an_2', name:'Nexus',        ckey:'antarctica', isCapital:false, lat:-80,lon:120,  realCountries:[] },
  { id:'an_3', name:'The Crossing', ckey:'antarctica', isCapital:false, lat:-80,lon:175,  realCountries:[] },
  { id:'an_4', name:'Voidgate',     ckey:'antarctica', isCapital:false, lat:-80,lon:-120, realCountries:[] },
  { id:'an_5', name:'The Rift',     ckey:'antarctica', isCapital:false, lat:-80,lon:-60,  realCountries:[] },
];

// ── LOOKUP: real country name → game country ──
const nameToGame = {};
GAME_COUNTRIES.forEach(gc => {
  (gc.realCountries||[]).forEach(name => { if (!nameToGame[name]) nameToGame[name] = gc; });
});

// ── LIVE STATE ──
// countries: { [gameCountryId]: { ownerUid, soldiers } }
// pool:      { [uid]: { iron, wild, court, swift, shadow, tide, gate } }
let LIVE_COUNTRIES = {};  // who owns what and how many soldiers stationed
let LIVE_POOL      = {};  // each player's undeployed soldier pool by army key
let CURRENT_UID    = null;

// ── CANVAS ──
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const W = 2048, H = 1024;
canvas.width = W; canvas.height = H;

function ll2px(lon, lat) {
  return [(lon + 180) / 360 * W, (90 - lat) / 180 * H];
}
function traceRing(ring) {
  if (!ring || ring.length < 2) return;
  let first = true, prevX = null;
  ring.forEach(([lon, lat]) => {
    const [x, y] = ll2px(lon, lat);
    if (first) { ctx.moveTo(x, y); first = false; }
    else if (prevX !== null && Math.abs(x - prevX) > W / 2) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
    prevX = x;
  });
  ctx.closePath();
}

setP(40);

// ── DRAW ──
function draw(t = 0) {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#020912';
  ctx.fillRect(0, 0, W, H);

  // Grid
  ctx.strokeStyle = 'rgba(61,165,255,0.05)';
  ctx.lineWidth = 0.5;
  for (let lat=-75; lat<=75; lat+=15) {
    const [,y] = ll2px(0,lat);
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
  }
  for (let lon=-180; lon<=180; lon+=30) {
    const [x] = ll2px(lon,0);
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke();
  }

  // Draw each country polygon
  COUNTRIES_GEO.forEach(country => {
    const gc = nameToGame[country.n];
    if (!gc) return;
    const state = LIVE_COUNTRIES[gc.id];
    const p = state?.ownerUid ? PLAYERS[state.ownerUid] : null;
    const pulse = p ? 0.78 + Math.sin(t * 0.003 + (ll2px(gc.lon||0, gc.lat||0)[0]) * 0.001) * 0.1 : 1;
    const fillCol = p ? `rgba(${p.r},${p.g},${p.b},${pulse})` : '#0a1828';
    const strokeCol = p ? `rgba(${p.r},${p.g},${p.b},0.5)` : 'rgba(61,165,255,0.12)';

    country.r.forEach(ring => {
      ctx.beginPath(); traceRing(ring);
      ctx.fillStyle = fillCol;
      ctx.strokeStyle = strokeCol;
      ctx.lineWidth = p ? 1.2 : 0.5;
      ctx.fill(); ctx.stroke();
    });
  });

  // Continent labels
  const CC = {northAmerica:[42,-100],southAmerica:[-20,-58],europe:[54,14],africa:[5,20],asia:[42,82],australia:[-28,134],antarctica:[-78,0]};
  Object.entries(CONT).forEach(([k,m]) => {
    const [lat,lon] = CC[k];
    const [x,y] = ll2px(lon,lat);
    ctx.font = 'bold 10px Courier New';
    ctx.fillStyle = m.hex + '44';
    ctx.textAlign = 'center';
    ctx.fillText(m.name.toUpperCase(), x, y);
  });

  // Game country dots
  GAME_COUNTRIES.forEach(c => {
    const [x,y] = ll2px(c.lon, c.lat);
    const state = LIVE_COUNTRIES[c.id];
    const p = state?.ownerUid ? PLAYERS[state.ownerUid] : null;
    const dpulse = p ? 0.85 + Math.sin(t*0.004 + x*0.002)*0.15 : 1;

    // Glow ring
    if (p) {
      const g = ctx.createRadialGradient(x,y,0,x,y,16*dpulse);
      g.addColorStop(0, `rgba(${p.r},${p.g},${p.b},0.4)`);
      g.addColorStop(1, 'transparent');
      ctx.beginPath(); ctx.arc(x,y,16*dpulse,0,Math.PI*2);
      ctx.fillStyle = g; ctx.fill();
    }

    // Dot
    ctx.beginPath();
    ctx.arc(x, y, c.isCapital ? 7 : 4.5, 0, Math.PI*2);
    ctx.fillStyle   = p ? `rgb(${p.r},${p.g},${p.b})` : '#0f2035';
    ctx.strokeStyle = p ? 'rgba(255,255,255,0.9)' : 'rgba(61,165,255,0.2)';
    ctx.lineWidth   = c.isCapital ? 2.5 : 1.5;
    ctx.fill(); ctx.stroke();

    if (c.isCapital) {
      ctx.font='9px Arial'; ctx.fillStyle='#fff'; ctx.textAlign='center';
      ctx.fillText('★',x,y+3.5);
    }

    // Soldier bar
    const soldiers = state?.soldiers || 0;
    if (soldiers > 0 && p) {
      const h = Math.min(Math.log10(soldiers+1)*9,34);
      ctx.fillStyle = `rgb(${p.r},${p.g},${p.b})`;
      ctx.fillRect(x-2,y-h-10,4,h);
      ctx.strokeStyle='rgba(255,255,255,0.3)'; ctx.lineWidth=0.5;
      ctx.strokeRect(x-2,y-h-10,4,h);
    }

    // Label (only if owned)
    if (p && state) {
      ctx.font=`${c.isCapital?'bold 10px':'9px'} Courier New`;
      ctx.textAlign='left';
      ctx.strokeStyle='rgba(0,0,0,0.95)'; ctx.lineWidth=3;
      ctx.strokeText(c.name,x+9,y+4);
      ctx.fillStyle=`rgb(${p.r},${p.g},${p.b})`;
      ctx.fillText(c.name,x+9,y+4);
    }
  });
}

let lastT = 0;
function animate(t) {
  requestAnimationFrame(animate);
  if (t - lastT < 50) return;
  lastT = t;
  draw(t);
}

// ── LOAD DATA FROM PARENT ──
let CURRENT_GC = null; // currently open panel

function loadFromParent() {
  return new Promise(resolve => {
    const timeout = setTimeout(() => {
      console.log('Shadow World: parent timeout, using empty state');
      resolve();
    }, 3000);

    window.addEventListener('message', (e) => {
      if (e.data?.type === 'shadowWorldData') {
        clearTimeout(timeout);
        LIVE_COUNTRIES = e.data.countries || {};
        LIVE_POOL      = e.data.pool      || {};
        CURRENT_UID    = e.data.currentUid || null;
        console.log('Shadow World: loaded', Object.keys(LIVE_COUNTRIES).length, 'occupied countries');
        resolve();
      }
    });

    window.parent.postMessage({ type: 'requestShadowWorldData' }, '*');
  });
}

loadFromParent().then(() => {
  setP(100);
  setTimeout(() => document.getElementById('load').style.display='none', 200);
  renderSidebar();
  requestAnimationFrame(animate);
});

// ── SIDEBAR — shows all continents, your pool, who holds what ──
function renderSidebar() {
  const el = document.getElementById('sidebar-continents');
  if (!el) return;
  const myPool = LIVE_POOL[CURRENT_UID] || {};

  el.innerHTML = Object.entries(CONT).map(([ckey, m]) => {
    const allInCont = GAME_COUNTRIES.filter(g => g.ckey === ckey);
    const pool = myPool[m.armyKey] || 0;

    // Count who holds what in this continent
    const holdMap = {}; // uid -> count
    let totalHeld = 0;
    allInCont.forEach(gc => {
      const s = LIVE_COUNTRIES[gc.id];
      if (s?.ownerUid) { holdMap[s.ownerUid] = (holdMap[s.ownerUid]||0)+1; totalHeld++; }
    });

    const myHeld = holdMap[CURRENT_UID] || 0;
    const dominated = Object.entries(holdMap).find(([,n]) => n === 6);

    // Build colour bar segments
    const segments = Object.entries(holdMap).map(([uid, n]) => {
      const p = PLAYERS[uid];
      return `<div class="cr-seg" style="width:${Math.round(n/6*100)}%;background:${p?.hex||'#fff'};"></div>`;
    }).join('');

    // Owner summary line
    const holders = Object.entries(holdMap).map(([uid, n]) => {
      const p = PLAYERS[uid];
      return `<span style="color:${p?.hex||'#fff'}">${p?.name||'?'}×${n}</span>`;
    }).join(' ');

    return `<div class="cont-row" onclick="focusContinent('${ckey}')">
      <div class="cr-name" style="color:${m.hex};">${m.icon} ${m.name}</div>
      <div class="cr-pool">Pool: <strong>${pool > 0 ? pool : '—'}</strong> ${pool > 0 ? `<span style="color:rgba(61,165,255,.3);">${m.armyKey}</span>` : `<span style="color:rgba(61,165,255,.2);">train ${m.stat}</span>`}</div>
      <div class="cr-bar">${segments || `<div style="font-size:8px;color:rgba(61,165,255,.2);padding:2px;">unclaimed</div>`}</div>
      <div class="cr-owned" style="color:rgba(61,165,255,.35);">${dominated ? `<span style="color:${PLAYERS[dominated[0]]?.hex}">★ ${PLAYERS[dominated[0]]?.name} dominates</span>` : holders || 'unclaimed'} ${myHeld ? `· <span style="color:#d4a017;">you: ${myHeld}/6</span>` : ''}</div>
    </div>`;
  }).join('');
}

// ── PAN + ZOOM ──
let tx=0,ty=0,sc=1;
function applyT(){canvas.style.transformOrigin='0 0';canvas.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`;}
function resetView(){
  const sidebarW = window.innerWidth > 600 ? 200 : 0;
  const topH     = window.innerWidth <= 600 ? 80 : 0; // strip height on mobile
  const availW   = innerWidth - sidebarW;
  const availH   = innerHeight - topH;
  sc = Math.min(availW/W, availH/H);
  tx = (availW - W*sc)/2;
  ty = topH + (availH - H*sc)/2;
  applyT();
}
resetView(); window.resetView=resetView;
window.doZoom=d=>{const ns=Math.max(0.4,Math.min(6,sc+d));tx=innerWidth/2-(innerWidth/2-tx)*(ns/sc);ty=innerHeight/2-(innerHeight/2-ty)*(ns/sc);sc=ns;applyT();};

const wrap=document.getElementById('wrap');
wrap.addEventListener('wheel',e=>{e.preventDefault();const ns=Math.max(0.4,Math.min(6,sc+(e.deltaY<0?0.15:-0.15)));tx=e.clientX-(e.clientX-tx)*(ns/sc);ty=e.clientY-(e.clientY-ty)*(ns/sc);sc=ns;applyT();},{passive:false});

let drag=false,ds={x:0,y:0},dt={x:0,y:0},moved=false;
wrap.addEventListener('mousedown',e=>{drag=true;moved=false;ds={x:e.clientX,y:e.clientY};dt={x:tx,y:ty};wrap.classList.add('drag');});
wrap.addEventListener('mousemove',e=>{if(drag){const dx=e.clientX-ds.x,dy=e.clientY-ds.y;if(Math.abs(dx)+Math.abs(dy)>4)moved=true;tx=dt.x+dx;ty=dt.y+dy;applyT();}updateTT(e.clientX,e.clientY);});
wrap.addEventListener('mouseup',e=>{wrap.classList.remove('drag');if(!moved)onClick(e.clientX,e.clientY);drag=false;});

let ld=0;
wrap.addEventListener('touchstart',e=>{e.preventDefault();moved=false;if(e.touches.length===1){const t=e.touches[0];drag=true;ds={x:t.clientX,y:t.clientY};dt={x:tx,y:ty};}if(e.touches.length===2)ld=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);},{passive:false});
wrap.addEventListener('touchmove',e=>{e.preventDefault();if(e.touches.length===1&&drag){const t=e.touches[0],dx=t.clientX-ds.x,dy=t.clientY-ds.y;if(Math.abs(dx)+Math.abs(dy)>4)moved=true;tx=dt.x+dx;ty=dt.y+dy;applyT();}if(e.touches.length===2){const d2=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);const ns=Math.max(0.4,Math.min(6,sc+(d2-ld)*0.005));const cx=(e.touches[0].clientX+e.touches[1].clientX)/2,cy=(e.touches[0].clientY+e.touches[1].clientY)/2;tx=cx-(cx-tx)*(ns/sc);ty=cy-(cy-ty)*(ns/sc);sc=ns;ld=d2;applyT();}},{passive:false});
wrap.addEventListener('touchend',e=>{drag=false;if(!moved&&e.changedTouches.length===1)onClick(e.changedTouches[0].clientX,e.changedTouches[0].clientY);});

function mapCoords(sx,sy){return[(sx-tx)/sc,(sy-ty)/sc];}
function nearest(sx,sy){const[mx,my]=mapCoords(sx,sy);let best=null,bd=Infinity;GAME_COUNTRIES.forEach(c=>{const[cx,cy]=ll2px(c.lon,c.lat);const d=Math.hypot(mx-cx,my-cy);if(d<bd){bd=d;best=c;}});return bd<30/sc?best:null;}
function onClick(sx,sy){const c=nearest(sx,sy);if(c)openPanel(c);}

function updateTT(sx,sy){
  const c=nearest(sx,sy); const tt=document.getElementById('tt');
  if(c){
    const state=LIVE_COUNTRIES[c.id];
    const p=state?.ownerUid?PLAYERS[state.ownerUid]:null;
    tt.style.display='block';tt.style.left=(sx+12)+'px';tt.style.top=(sy-28)+'px';
    tt.textContent=c.name+(state?` · ${p?.name||'?'} · ${state.soldiers} soldiers`:' · Unclaimed');
  } else tt.style.display='none';
}

function openPanel(c) {
  CURRENT_GC = c;
  const m    = CONT[c.ckey];
  const state = LIVE_COUNTRIES[c.id];
  const ownerP = state?.ownerUid ? PLAYERS[state.ownerUid] : null;
  const isOwner = state?.ownerUid === CURRENT_UID;
  const myPool  = (LIVE_POOL[CURRENT_UID] || {})[m.armyKey] || 0;

  // Count continent ownership
  const allInCont = GAME_COUNTRIES.filter(g => g.ckey === c.ckey);
  const ownedByUid = {};
  allInCont.forEach(g => {
    const s = LIVE_COUNTRIES[g.id];
    if (s?.ownerUid) ownedByUid[s.ownerUid] = (ownedByUid[s.ownerUid]||0)+1;
  });
  const myOwned = ownedByUid[CURRENT_UID] || 0;
  const dominated = Object.entries(ownedByUid).find(([,n]) => n === 6);

  // Header
  document.getElementById('pc').textContent = `${m.icon} ${m.name.toUpperCase()} · ${m.stat}`;
  document.getElementById('pc').style.color = m.hex;
  document.getElementById('pn').textContent = (c.isCapital?'★ ':'')+c.name;
  document.getElementById('pn').style.color = ownerP?.hex || '#61a5ff';

  // Owner line
  if (state && ownerP) {
    document.getElementById('po').innerHTML = `<span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${ownerP.hex};margin-right:6px;vertical-align:middle;"></span><strong style="color:${ownerP.hex};">${ownerP.name}</strong> holds this territory`;
  } else {
    document.getElementById('po').innerHTML = `<span style="color:rgba(61,165,255,0.4);">Unclaimed — deploy soldiers to take this territory</span>`;
  }

  // Continent progress bar
  const leaders = Object.entries(ownedByUid).sort((a,b)=>b[1]-a[1]);
  const progressHTML = `
    <div style="font-family:var(--font-mono,monospace);font-size:9px;color:${m.hex};letter-spacing:.12em;margin-bottom:6px;">${m.icon} CONTINENT CONTROL</div>
    ${dominated ? `<div style="font-size:11px;color:${PLAYERS[dominated[0]]?.hex||'#fff'};font-weight:700;margin-bottom:6px;">★ ${PLAYERS[dominated[0]]?.name||'?'} dominates ${m.name}</div>` : ''}
    ${leaders.map(([uid,n]) => {
      const pl = PLAYERS[uid];
      if (!pl) return '';
      const pct = Math.round(n/6*100);
      return `<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;">
        <span style="color:${pl.hex};font-size:10px;min-width:60px;">${pl.name}</span>
        <div style="flex:1;height:4px;background:rgba(61,165,255,.08);border-radius:2px;overflow:hidden;">
          <div style="width:${pct}%;height:100%;background:${pl.hex};border-radius:2px;"></div>
        </div>
        <span style="font-size:10px;color:${pl.hex};">${n}/6</span>
      </div>`;
    }).join('')}
    ${!leaders.length ? `<div style="font-size:10px;color:rgba(61,165,255,.3);">No players have territory here yet</div>` : ''}
    <div style="margin-top:6px;font-size:10px;color:rgba(61,165,255,.3);">Train ${m.stat} → earn ${m.armyKey} soldiers → deploy here</div>
  `;
  document.getElementById('cont-progress').innerHTML = progressHTML;

  // Stats row
  document.getElementById('ps').innerHTML = `
    <div class="sc"><div class="sn" style="color:${ownerP?.hex||'#61a5ff'}">${state?.soldiers||'—'}</div><div class="sl">STATIONED</div></div>
    <div class="sc"><div class="sn" style="color:${m.hex}">${myOwned}/6</div><div class="sl">MY HOLD</div></div>
    <div class="sc"><div class="sn" style="color:${m.hex}">${myPool}</div><div class="sl">MY POOL</div></div>
  `;

  // Pool info
  document.getElementById('pool-info').innerHTML = myPool > 0
    ? `<span style="color:rgba(61,165,255,.5);">You have <strong style="color:#d4a017;">${myPool}</strong> ${m.armyKey} soldiers ready to deploy. Train more ${m.stat} to earn more.</span>`
    : `<span style="color:rgba(61,165,255,.3);">Train ${m.stat} exercises to earn ${m.armyKey} soldiers for this continent.</span>`;

  // Deploy row — show if player has pool soldiers
  const deployRow = document.getElementById('deploy-row');
  if (myPool > 0 && !isOwner) {
    deployRow.style.display = 'flex';
    const input = document.getElementById('deploy-input');
    input.max = myPool;
    input.value = Math.min(10, myPool);
    document.getElementById('deploy-btn').onclick = () => deployToCountry(c, parseInt(input.value)||1);
  } else if (myPool > 0 && isOwner) {
    deployRow.style.display = 'flex';
    const input = document.getElementById('deploy-input');
    input.max = myPool;
    input.value = Math.min(10, myPool);
    document.getElementById('deploy-btn').textContent = '⬆ Reinforce';
    document.getElementById('deploy-btn').onclick = () => deployToCountry(c, parseInt(input.value)||1);
  } else {
    deployRow.style.display = 'none';
  }

  // Action buttons
  const pa = document.getElementById('pa');
  if (!state) {
    // Unclaimed
    pa.innerHTML = myPool > 0
      ? `<button class="pb bc" onclick="quickDeploy('${c.id}')">⚑ Claim (deploy above)</button>`
      : `<button class="pb bc" style="opacity:.5;cursor:default;">⚑ Train to Claim</button>`;
  } else if (isOwner) {
    pa.innerHTML = `<button class="pb br" onclick="closePanel()">✓ Your Territory</button>`;
  } else {
    // Owned by someone else — can declare war via Gate Duel
    pa.innerHTML = `<button class="pb ba" onclick="declareWar('${c.id}','${state.ownerUid}')">⚔ Declare War</button>`;
  }

  document.getElementById('panel').classList.add('open');
}

function quickDeploy(gcId) {
  const input = document.getElementById('deploy-input');
  deployToCountry(GAME_COUNTRIES.find(g=>g.id===gcId), parseInt(input.value)||1);
}

function deployToCountry(c, amount) {
  const m = CONT[c.ckey];
  const myPool = (LIVE_POOL[CURRENT_UID]||{})[m.armyKey]||0;
  if (amount <= 0 || amount > myPool) {
    alert(`You only have ${myPool} ${m.armyKey} soldiers available.`); return;
  }
  // Send deploy command to parent
  window.parent.postMessage({
    type: 'deployToCountry',
    gcId: c.id,
    armyKey: m.armyKey,
    amount,
    ckey: c.ckey,
  }, '*');
  // Optimistic update
  if (!LIVE_COUNTRIES[c.id]) LIVE_COUNTRIES[c.id] = { ownerUid: CURRENT_UID, soldiers: 0 };
  else if (!LIVE_COUNTRIES[c.id].ownerUid) LIVE_COUNTRIES[c.id].ownerUid = CURRENT_UID;
  LIVE_COUNTRIES[c.id].soldiers = (LIVE_COUNTRIES[c.id].soldiers||0) + amount;
  if (!LIVE_POOL[CURRENT_UID]) LIVE_POOL[CURRENT_UID] = {};
  LIVE_POOL[CURRENT_UID][m.armyKey] = Math.max(0, myPool - amount);
  closePanel();
  renderSidebar();
  setTimeout(() => openPanel(c), 100); // re-open with updated state
}

function declareWar(gcId, defenderUid) {
  window.parent.postMessage({ type: 'shadowWorldDeclareWar', gcId, defenderUid }, '*');
  closePanel();
}

window.closePanel = () => document.getElementById('panel').classList.remove('open');
window.addEventListener('resize', resetView);

// Focus map on a continent when clicking sidebar
const CONT_CENTERS = {
  northAmerica:[42,-100], southAmerica:[-20,-58], europe:[54,14],
  africa:[5,20], asia:[42,82], australia:[-28,134], antarctica:[-78,0]
};
window.focusContinent = (ckey) => {
  const [lat,lon] = CONT_CENTERS[ckey] || [0,0];
  const [cx,cy] = ll2px(lon,lat);
  const sidebarW = window.innerWidth > 600 ? 200 : 0;
  const availW = innerWidth - sidebarW;
  sc = 1.8;
  tx = availW/2 - cx*sc;
  ty = innerHeight/2 - cy*sc;
  applyT();
};
</script>
