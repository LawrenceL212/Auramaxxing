<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Shadow World</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#020c18; color:#e0e8ff; font-family:'Courier New',monospace; overflow:hidden; height:100dvh; }
#map-area { position:relative; width:100vw; height:100dvh; overflow:hidden; }
#wrap { position:absolute; inset:0; cursor:grab; }
#wrap.drag { cursor:grabbing; }
canvas { display:block; }
#hud { position:absolute; top:0; left:0; right:0; padding:8px 14px; display:flex; justify-content:space-between; align-items:center; pointer-events:none; z-index:20; background:linear-gradient(180deg,rgba(2,12,24,0.9) 0%,transparent 100%); }
#wt { font-size:13px; letter-spacing:.18em; color:#61a5ff; text-shadow:0 0 16px rgba(61,165,255,.7); }
#ws { font-size:8px; color:rgba(61,165,255,.35); letter-spacing:.2em; margin-top:1px; }
#zb { position:absolute; right:10px; bottom:20px; display:flex; flex-direction:column; gap:6px; z-index:20; }
.zb { width:34px; height:34px; background:rgba(2,12,24,0.85); border:1px solid rgba(61,165,255,0.2); border-radius:8px; color:#61a5ff; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; touch-action:manipulation; }
#tt { position:fixed; pointer-events:none; background:rgba(2,12,24,0.95); border:1px solid rgba(61,165,255,0.3); border-radius:6px; padding:5px 10px; font-size:11px; color:#61a5ff; z-index:30; display:none; white-space:nowrap; }
/* Panel */
#panel { position:absolute; bottom:0; left:0; right:0; transform:translateY(100%); transition:transform .35s cubic-bezier(.16,1,.3,1); background:rgba(2,12,24,0.98); border-top:1px solid rgba(61,165,255,.15); border-radius:20px 20px 0 0; padding:0 18px 18px; z-index:30; max-height:70dvh; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }
#panel.open { transform:translateY(0); }
#panel-header { display:flex; align-items:center; justify-content:space-between; padding:14px 0 10px; position:sticky; top:0; background:rgba(2,12,24,0.98); border-bottom:1px solid rgba(61,165,255,.08); margin-bottom:12px; }
#px { background:rgba(61,165,255,.08); border:1px solid rgba(61,165,255,.2); color:#61a5ff; font-size:18px; cursor:pointer; width:44px; height:44px; display:flex; align-items:center; justify-content:center; border-radius:8px; touch-action:manipulation; }
#panel-backdrop { display:none; position:absolute; inset:0; z-index:29; }
#panel-backdrop.open { display:block; }
#pc { font-size:9px; letter-spacing:.15em; margin-bottom:2px; }
#pn { font-size:20px; font-weight:800; margin-bottom:4px; }
#po { font-size:11px; color:rgba(61,165,255,.5); margin-bottom:10px; }
#ps { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
.sc { padding:8px 12px; background:rgba(61,165,255,.05); border:1px solid rgba(61,165,255,.1); border-radius:8px; text-align:center; min-width:70px; }
.sn { font-size:15px; font-weight:800; }
.sl { font-size:8px; color:rgba(61,165,255,.4); margin-top:2px; letter-spacing:.05em; }
#pa { display:flex; gap:8px; flex-wrap:wrap; }
.pb { flex:1; min-width:100px; padding:11px; border-radius:10px; font-family:'Courier New',monospace; font-size:12px; font-weight:700; cursor:pointer; border:none; touch-action:manipulation; letter-spacing:.04em; }
.bc { background:rgba(61,165,255,.12); border:1px solid rgba(61,165,255,.3); color:#61a5ff; }
.ba { background:rgba(255,61,90,.1); border:1px solid rgba(255,61,90,.3); color:#ff3d5a; }
.br { background:rgba(78,205,120,.08); border:1px solid rgba(78,205,120,.25); color:#4ecd78; }
.bd { background:rgba(212,160,23,.12); border:1px solid rgba(212,160,23,.35); color:#d4a017; }
.bg { background:rgba(148,163,184,.08); border:1px solid rgba(148,163,184,.2); color:#94a3b8; }
#deploy-row { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
#deploy-row input { background:rgba(61,165,255,.06); border:1px solid rgba(61,165,255,.2); border-radius:8px; color:#e0e8ff; font-family:'Courier New',monospace; font-size:16px; padding:8px 12px; width:80px; text-align:center; -webkit-text-fill-color:#e0e8ff; }
#pool-info { font-size:11px; color:rgba(61,165,255,.4); margin-bottom:12px; line-height:1.7; }
#cont-progress { margin-bottom:12px; }
/* Deploy planner: a continent view to load several territories at once */
#planner { position:absolute; inset:0; z-index:36; background:rgba(2,6,14,.82); backdrop-filter:blur(4px); display:flex; align-items:flex-end; justify-content:center; }
#planner[hidden] { display:none; }
#pl-sheet { width:100%; max-width:520px; max-height:94dvh; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; touch-action:pan-y; background:linear-gradient(180deg,#121a2e,#0d1220); border:1px solid rgba(91,168,255,.3); border-bottom:0; border-radius:18px 18px 0 0; padding:14px 14px calc(18px + env(safe-area-inset-bottom,0px)); font-family:'Rajdhani',sans-serif; color:#f2f5fa; }
.pl-top { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.pl-crest { flex:none; width:40px; height:40px; display:grid; place-items:center; font-size:20px; border:1px solid var(--pl,#f59e0b); background:rgba(255,255,255,.05); clip-path:polygon(50% 0,100% 20%,100% 70%,50% 100%,0 70%,0 20%); }
.pl-cn { font-family:'Orbitron',sans-serif; font-size:15px; letter-spacing:.04em; }
.pl-cs { font-family:'Share Tech Mono',monospace; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--pl,#f59e0b); }
.pl-res { margin-left:auto; text-align:right; }
.pl-res b { display:block; font-family:'Orbitron',sans-serif; font-size:22px; color:#ffd66b; }
.pl-res span { font-family:'Share Tech Mono',monospace; font-size:10px; letter-spacing:.12em; color:#5d6a86; }
.pl-x { flex:none; width:44px; height:44px; border:1px solid rgba(91,168,255,.3); background:transparent; color:#97a3bd; border-radius:8px; font-size:16px; cursor:pointer; }
.pl-pre { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-bottom:10px; }
.pl-pre button { min-height:44px; border:1px solid rgba(91,168,255,.3); background:rgba(91,168,255,.06); color:#f2f5fa; font-family:'Share Tech Mono',monospace; font-size:13px; border-radius:6px; cursor:pointer; touch-action:manipulation; }
.pl-map { border:1px solid rgba(91,168,255,.28); background:radial-gradient(120% 90% at 50% 0%,rgba(91,168,255,.10),transparent 70%),#05070c; border-radius:8px; margin-bottom:8px; padding:4px; }
.pl-map svg { display:block; width:100%; height:auto; }
.pl-map path { stroke:#05070c; stroke-width:.6; stroke-linejoin:round; cursor:pointer; }
.pl-map g.me path { fill:rgba(245,158,11,.55); } .pl-map g.free path { fill:rgba(91,168,255,.22); } .pl-map g.foe path { fill:rgba(255,107,130,.5); } .pl-map g.add path { fill:rgba(255,214,107,.65); }
.pl-map g.sel path { stroke:#ffd66b; stroke-width:2; filter:drop-shadow(0 0 6px rgba(255,214,107,.8)); }
.pl-badge { font-family:'Orbitron',sans-serif; font-weight:800; font-size:11px; text-anchor:middle; pointer-events:none; fill:#fff; paint-order:stroke; stroke:#05070c; stroke-width:3px; }
.pl-lab { font-family:'Share Tech Mono',monospace; font-size:7.5px; text-anchor:middle; pointer-events:none; fill:#cfd8ea; paint-order:stroke; stroke:#05070c; stroke-width:2.5px; }
.pl-chips { display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; margin-bottom:8px; }
.pl-chip { flex:none; min-height:40px; padding:0 10px; border:1px solid rgba(91,168,255,.3); background:rgba(91,168,255,.05); color:#cfd8ea; font-family:'Share Tech Mono',monospace; font-size:12px; border-radius:6px; cursor:pointer; white-space:nowrap; }
.pl-chip.sel { border-color:#ffd66b; color:#ffd66b; } .pl-chip.foe { border-color:rgba(255,107,130,.6); } .pl-chip.me { border-color:rgba(245,158,11,.6); }
.pl-key { display:flex; flex-wrap:wrap; gap:4px 12px; margin:0 0 8px; font-family:'Share Tech Mono',monospace; font-size:11px; color:#97a3bd; }
.pl-key i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:-1px; }
.pl-card { border:1px solid rgba(245,158,11,.5); background:rgba(91,168,255,.04); padding:10px; border-radius:8px; margin-bottom:10px; display:grid; grid-template-columns:1fr auto; gap:6px 10px; }
.pl-card.free { border-style:dashed; border-color:rgba(91,168,255,.4); } .pl-card.foe { border-color:rgba(255,107,130,.5); background:rgba(255,107,130,.05); }
.pl-tn { font-weight:700; font-size:17px; } .pl-tn small { font-family:'Share Tech Mono',monospace; font-weight:400; font-size:11px; color:#5d6a86; margin-left:6px; letter-spacing:.08em; }
.pl-tg { font-family:'Share Tech Mono',monospace; font-size:12px; color:#97a3bd; } .pl-tg b { color:#f2f5fa; font-weight:400; } .pl-tg i { font-style:normal; color:#6fffb0; }
.pl-ctl { display:flex; align-items:center; gap:6px; }
.pl-ctl button { width:44px; height:44px; border-radius:50%; border:1.5px solid #ffd66b; background:rgba(255,214,107,.08); color:#ffd66b; font-family:'Orbitron',sans-serif; font-size:20px; cursor:pointer; touch-action:manipulation; }
.pl-ctl output { min-width:34px; text-align:center; font-family:'Orbitron',sans-serif; font-size:16px; color:#ffd66b; }
.pl-bar { grid-column:1/-1; height:7px; background:rgba(255,255,255,.07); border-radius:4px; overflow:hidden; display:flex; }
.pl-bar .a { background:#f59e0b; } .pl-bar .n { background:repeating-linear-gradient(45deg,#ffd66b 0 5px,#e0a92e 5px 10px); }
.pl-foot { grid-column:1/-1; display:flex; gap:8px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
.pl-step { display:flex; gap:6px; } .pl-step button, .pl-war { min-height:40px; padding:0 12px; border:1px solid rgba(91,168,255,.3); background:transparent; color:#97a3bd; font-family:'Share Tech Mono',monospace; border-radius:6px; cursor:pointer; }
.pl-step button.on { color:#ffd66b; border-color:#ffd66b; } .pl-war { color:#ff6b82; border-color:#ff6b82; }
.pl-sum { margin:0 0 12px; border:1px solid rgba(91,168,255,.28); background:rgba(91,168,255,.05); padding:10px 12px; display:grid; gap:6px; font-family:'Share Tech Mono',monospace; font-size:13px; }
.pl-row { display:flex; justify-content:space-between; gap:8px; color:#97a3bd; } .pl-row em { font-style:normal; color:#f2f5fa; text-align:right; } .pl-row em.g { color:#6fffb0; }
.pl-go { width:100%; min-height:56px; border:0; cursor:pointer; font-family:'Orbitron',sans-serif; font-weight:800; font-size:14px; letter-spacing:.1em; text-transform:uppercase; color:#1a0f00; background:linear-gradient(90deg,#ff8a3d,#ffd66b); box-shadow:0 0 26px rgba(255,214,107,.4); clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px); }
.pl-go[disabled] { filter:grayscale(1) brightness(.5); box-shadow:none; cursor:default; }
/* In-game notification */
#sw-notif { position:absolute; top:50px; left:50%; transform:translateX(-50%); z-index:40; pointer-events:none; display:flex; flex-direction:column; gap:6px; align-items:center; }
.sw-notif-msg { background:rgba(2,12,24,0.95); border:1px solid rgba(61,165,255,.3); border-radius:10px; padding:10px 18px; font-size:12px; color:#e0e8ff; white-space:nowrap; animation:notifPop .25s cubic-bezier(.16,1,.3,1); box-shadow:0 4px 20px rgba(0,0,0,.4); }
@keyframes notifPop { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)} }
/* Antarctica locked overlay */
#gate-locked { position:absolute; bottom:80px; left:50%; transform:translateX(-50%); background:rgba(2,12,24,0.9); border:1px solid rgba(148,163,184,.25); border-radius:10px; padding:10px 18px; font-size:11px; color:rgba(148,163,184,.7); pointer-events:none; white-space:nowrap; display:none; z-index:25; text-align:center; }
/* Strength bar */
.str-bar-wrap { height:4px; background:rgba(255,255,255,.08); border-radius:2px; overflow:hidden; margin-top:4px; }
.str-bar-fill { height:100%; border-radius:2px; transition:width .4s; }
#load {
  position:fixed; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  background:#010409; z-index:50;
}
.load-bg {
  position:absolute; inset:0;
  background:
    radial-gradient(ellipse 600px 400px at 50% 40%, rgba(91,168,255,0.06) 0%, transparent 70%),
    radial-gradient(ellipse 400px 300px at 20% 80%, rgba(139,92,255,0.05) 0%, transparent 60%);
  animation: loadBgPulse 4s ease-in-out infinite;
}
@keyframes loadBgPulse { 0%,100%{opacity:.6} 50%{opacity:1} }
.load-content {
  position:relative; display:flex; flex-direction:column;
  align-items:center; gap:10px; text-align:center; padding:20px;
  font-family:'Courier New',monospace;
}
.load-system {
  font-size:9px; letter-spacing:.3em; color:rgba(91,168,255,.3);
  margin-bottom:8px;
}
.load-gate-icon {
  font-size:52px; margin-bottom:4px;
  animation: gateRotate 8s linear infinite;
  filter: drop-shadow(0 0 20px rgba(91,168,255,.5));
}
@keyframes gateRotate { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
.load-title {
  font-size:28px; font-weight:900; letter-spacing:.12em;
  color:#F2F5FA;
  text-shadow: 0 0 30px rgba(91,168,255,.4);
}
.load-sub {
  font-size:9px; letter-spacing:.25em; color:rgba(91,168,255,.35);
  margin-bottom:4px;
}
.load-divider {
  width:120px; height:1px;
  background:linear-gradient(90deg,transparent,rgba(91,168,255,.3),transparent);
  margin:8px 0;
}
.load-flavor {
  font-size:11px; color:rgba(242,245,250,.3); letter-spacing:.06em;
  min-height:16px; margin-bottom:8px;
  animation: flavorFade 1s ease-in-out;
}
@keyframes flavorFade { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }
.lb { width:200px; height:2px; background:rgba(91,168,255,.08); border-radius:1px; }
.lf { height:100%; background:linear-gradient(90deg,#3b82f6,#8B5CFF); border-radius:1px; transition:width .3s ease; box-shadow:0 0 8px rgba(91,168,255,.4); }
.load-warning {
  font-size:9px; letter-spacing:.2em; color:rgba(91,168,255,.2);
  margin-top:8px; animation: warningPulse 2s ease-in-out infinite;
}
@keyframes warningPulse { 0%,100%{opacity:.3} 50%{opacity:.7} }
/* ── Conquest lock overlay ── */
#conquest-lock-overlay {
  position: fixed; inset: 0; z-index: 9000;
  background: rgba(1,4,10,0.93);
  backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Courier New', monospace;
  animation: cloIn .5s cubic-bezier(0.16,1,0.3,1) both;
}
@keyframes cloIn { from { opacity:0; transform:scale(1.04); } to { opacity:1; transform:scale(1); } }
.clo-inner {
  text-align: center; padding: 40px 32px; max-width: 340px;
}
.clo-system {
  font-size: 9px; letter-spacing: .3em; color: rgba(91,168,255,.3);
  margin-bottom: 24px;
}
.clo-sword {
  font-size: 48px; margin-bottom: 20px;
  filter: drop-shadow(0 0 20px rgba(91,168,255,.4));
  animation: swordPulse 3s ease-in-out infinite;
}
@keyframes swordPulse { 0%,100%{filter:drop-shadow(0 0 12px rgba(91,168,255,.3))} 50%{filter:drop-shadow(0 0 28px rgba(91,168,255,.7))} }
.clo-title {
  font-size: 26px; font-weight: 900; letter-spacing: .1em;
  color: #F2F5FA; margin-bottom: 10px;
}
.clo-sub {
  font-size: 12px; color: rgba(242,245,250,.4); line-height: 1.8;
  margin-bottom: 32px;
}
.clo-timer-wrap {
  background: rgba(91,168,255,.05);
  border: 1px solid rgba(91,168,255,.18);
  border-radius: 12px; padding: 18px 28px; margin-bottom: 28px;
  box-shadow: 0 0 40px rgba(91,168,255,.06), inset 0 1px 0 rgba(91,168,255,.08);
}
.clo-timer-label {
  font-size: 8px; letter-spacing: .25em; color: rgba(91,168,255,.35);
  margin-bottom: 10px;
}
.clo-timer {
  font-size: 32px; font-weight: 700; color: #5BA8FF;
  letter-spacing: .04em;
  text-shadow: 0 0 20px rgba(91,168,255,.5);
}
.clo-pillars {
  display: flex; align-items: center; gap: 10px;
  justify-content: center; flex-wrap: wrap;
}
.clo-pillar {
  font-size: 9px; color: rgba(242,245,250,.2); letter-spacing: .08em; line-height: 1.7;
}
.clo-pillar span { color: rgba(91,168,255,.4); }
.clo-sep { color: rgba(91,168,255,.15); font-size: 16px; }

</style>
</head>
<body>
<div id="load">
  <div class="load-bg"></div>
  <div class="load-content">
    <div class="load-system">◈ THE SYSTEM ◈</div>
    <div class="load-gate-icon">🌀</div>
    <div class="load-title">SHADOW WORLD</div>
    <div class="load-sub">TERRITORIAL COMMAND</div>
    <div class="load-divider"></div>
    <div class="load-flavor" id="load-flavor">Initialising global surveillance...</div>
    <div class="lb"><div class="lf" id="lf" style="width:0%"></div></div>
    <div class="load-warning">The System is watching.</div>
  </div>
</div>
<div id="map-area">
  <div id="wrap"><canvas id="c"></canvas></div>
  <div id="hud"><div><div id="wt">◈ SHADOW WORLD</div><div id="ws">TERRITORIAL COMMAND</div></div></div>
  <div id="zb">
    <button class="zb" onclick="doZoom(0.3)">+</button>
    <button class="zb" onclick="doZoom(-0.3)">−</button>
    <button class="zb" style="font-size:13px;" onclick="resetView()">⌂</button>
  </div>
  <div id="sw-notif"></div>
  <div id="gate-locked">⚔ THE GATE — Locked<br><span style="font-size:9px;color:rgba(148,163,184,.4);">Dominate 3 continents to unlock</span></div>
  <div id="tt"></div>
  <div id="panel-backdrop" onclick="closePanel()"></div>
<div id="planner" role="dialog" aria-modal="true" aria-label="Deploy planner" hidden>
  <div id="pl-sheet"></div>
</div>

  <div id="panel">
    <div id="panel-header">
      <div>
        <div id="pc"></div>
        <div id="pn"></div>
      </div>
      <button id="px" onclick="closePanel()">✕</button>
    </div>
    <!-- Deploy first: in the World page's short map window the bottom of this panel is off screen -->
    <div id="pool-info"></div>
    <div id="planner-row" style="display:none;margin-bottom:12px;"><button class="pb bd" id="open-planner" style="width:100%;min-height:48px;">⚑ DEPLOY PLANNER · SEE THE CONTINENT</button></div>
    <div id="deploy-row" style="display:none;">
      <input type="number" id="deploy-input" min="1" value="10" inputmode="numeric" />
      <button class="pb bd" id="deploy-btn" style="flex:none;padding:9px 16px;">⚑ Deploy</button>
    </div>
    <div id="po"></div>
    <div id="cont-progress"></div>
    <div id="ps"></div>
    <div id="pa"></div>
  </div>
</div>

<script type="module">
import { COUNTRIES_GEO } from './countries_embedded.js';

const setP = p => {
  const bar = document.getElementById('lf');
  if (bar) bar.style.width = p + '%';
  const fl = document.getElementById('load-flavor');
  if (fl) {
    const flavors = [
      'Scanning global territories...',
      'Detecting hostile activity...',
      'Calibrating shadow coordinates...',
      'Establishing System connection...',
      'Mapping dimensional boundaries...',
      'Initialising territorial command...',
    ];
    const idx = Math.min(Math.floor((p / 100) * flavors.length), flavors.length - 1);
    fl.style.animation = 'none';
    fl.offsetHeight;
    fl.style.animation = 'flavorFade 1s ease-in-out';
    fl.textContent = flavors[idx];
  }
};

// ── PLAYERS ──
// The original four; the parent sends every Hunter's colour and name with the world data
// (world-players.js), so territories held by anyone else draw as theirs, not as unclaimed.
const PLAYERS = {
  'eUtGPwQBcCSO0x3xS3ZGYFGXNIT2': { hex:'#d4a017', r:212, g:160, b:23,  name:'Lawrence' },
  'd1W5vTx5aSTIwkR4CIwnO2xW7vf1': { hex:'#7c3aed', r:124, g:58,  b:237, name:'LuChing'  },
  'rzcznIkNRrSKVXl74LsTaRSdHOk2': { hex:'#0ea5e9', r:14,  g:165, b:233, name:'Lucas'    },
  'oFFi2hATYARhqcSZQlHwlsYBOge2': { hex:'#ff6b9d', r:255, g:107, b:157, name:'Mireyah'  },
};

// ── CONTINENT METADATA ──
const CONT = {
  northAmerica: { name:'Iron Highlands',  armyKey:'iron',   stat:'Strength',    hex:'#e05555', icon:'🏋️', bonus:'+Attack' },
  southAmerica: { name:'Wild Summit',     armyKey:'wild',   stat:'Flexibility', hex:'#22c55e', icon:'🧗',  bonus:'+Evasion' },
  europe:       { name:'Court Arena',     armyKey:'court',  stat:'Combat',      hex:'#f59e0b', icon:'🥊',  bonus:'+Combat' },

const canvas = document.getElementById('c');

let ctx = canvas.getContext('2d');

function ll2px(lon, lat) { return [(lon+180)/360*W, (90-lat)/180*H]; }
function traceRing(ring) {
  if (!ring||ring.length<2) return;
  let first=true, prevX=null;
  ring.forEach(([lon,lat])=>{
    const [x,y]=ll2px(lon,lat);
    if(first){ctx.moveTo(x,y);first=false;}
    else if(prevX!==null&&Math.abs(x-prevX)>W/2)ctx.moveTo(x,y);
    else ctx.lineTo(x,y);
    prevX=x;
  });
  ctx.closePath();
}

function isExplorationLocked() {
  if (!EXPLORATION_UNLOCKS_AT) return false;
  return new Date() < new Date(EXPLORATION_UNLOCKS_AT);
}
function explorationSecsRemaining() {
  if (!EXPLORATION_UNLOCKS_AT) return 0;
  return Math.max(0, Math.floor((new Date(EXPLORATION_UNLOCKS_AT) - new Date()) / 1000));
}

// ── TERRITORY BOUNDARY CACHE ──
// Pre-compute bounding box per game country for fast boundary drawing
const gcBounds = {}; // gcId → {minX,maxX,minY,maxY}

function buildBounds() {
  COUNTRIES_GEO.forEach(country => {
    const gc = nameToGame[country.n];
    if (!gc) return;
    if (!gcBounds[gc.id]) gcBounds[gc.id] = {minX:Infinity,maxX:-Infinity,minY:Infinity,maxY:-Infinity, rings:[]};
    const b = gcBounds[gc.id];
    country.r.forEach(ring => {
      b.rings.push(ring);
      ring.forEach(([lon,lat]) => {
        const [x,y] = ll2px(lon,lat);
        if(x<b.minX)b.minX=x; if(x>b.maxX)b.maxX=x;
        if(y<b.minY)b.minY=y; if(y>b.maxY)b.maxY=y;
      });
    });
  });
}

// ── ANTARCTICA LOCK ──
function getUnlockedContinents() {
  const dominated = new Set();
  Object.entries(CONT).forEach(([ckey, m]) => {
    if (m.locked) return;
    const ids = GAME_COUNTRIES.filter(g=>g.ckey===ckey).map(g=>g.id);
    const ownerCount = {};
    ids.forEach(id => {
      const uid = LIVE_COUNTRIES[id]?.ownerUid;
      if (uid) ownerCount[uid] = (ownerCount[uid]||0)+1;
    });
    if (Object.values(ownerCount).some(n=>n===6)) dominated.add(ckey);
  });
  return dominated;
}

function isAntarcticaUnlocked() {
  return getUnlockedContinents().size >= 3;
}

// ── DRAW ──
/* ── DEPTH / ATMOSPHERE (Phase 8) ─────────────────────────────────────────
   An equirectangular map is flat by construction. These layers give it a body:
   limb darkening towards the edges, a horizon haze, and a vignette. They never
   change, so they are rasterised once and blitted - the per-frame cost is two
   drawImage calls, which is why the 30fps budget is unaffected. */
let _depthLayer = null, _lockLayer = null;

function buildDepthLayer() {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const d = c.getContext('2d');
  // limb darkening - the world curves away at the edges
  const lg = d.createLinearGradient(0, 0, W, 0);
  lg.addColorStop(0,    'rgba(1,4,10,0.62)');
  lg.addColorStop(0.16, 'rgba(1,4,10,0.16)');
  lg.addColorStop(0.5,  'rgba(1,4,10,0)');
  lg.addColorStop(0.84, 'rgba(1,4,10,0.16)');
  lg.addColorStop(1,    'rgba(1,4,10,0.62)');
  d.fillStyle = lg; d.fillRect(0, 0, W, H);
  // poles fall away as well, so the sphere reads in both axes
  const vg = d.createLinearGradient(0, 0, 0, H);
  vg.addColorStop(0,    'rgba(1,4,10,0.70)');
  vg.addColorStop(0.22, 'rgba(1,4,10,0.10)');
  vg.addColorStop(0.78, 'rgba(1,4,10,0.10)');
  vg.addColorStop(1,    'rgba(1,4,10,0.70)');
  d.fillStyle = vg; d.fillRect(0, 0, W, H);
  // upper-atmosphere haze - a cold rim of light above the horizon line
  const hz = d.createLinearGradient(0, H * 0.06, 0, H * 0.30);
  hz.addColorStop(0, 'rgba(91,168,255,0.055)');
  hz.addColorStop(1, 'transparent');
  d.fillStyle = hz; d.fillRect(0, 0, W, H * 0.30);
  const hz2 = d.createLinearGradient(0, H * 0.94, 0, H * 0.72);
  hz2.addColorStop(0, 'rgba(139,92,255,0.045)');
  hz2.addColorStop(1, 'transparent');
  d.fillStyle = hz2; d.fillRect(0, H * 0.72, W, H * 0.28);
  // corner vignette
  const rg = d.createRadialGradient(W/2, H/2, H*0.28, W/2, H/2, W*0.62);
  rg.addColorStop(0, 'transparent');
  rg.addColorStop(1, 'rgba(0,2,6,0.55)');
  d.fillStyle = rg; d.fillRect(0, 0, W, H);
  return c;
}

// Exploration lock is existing state (EXPLORATION_UNLOCKS_AT). The map is shown
// as scanned-but-not-yet-open rather than simply greyed out.
function buildLockLayer() {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const d = c.getContext('2d');
  d.fillStyle = 'rgba(2,6,14,0.55)'; d.fillRect(0, 0, W, H);
  d.strokeStyle = 'rgba(91,168,255,0.07)'; d.lineWidth = 1;
  for (let y = 0; y < H; y += 4) { d.beginPath(); d.moveTo(0, y); d.lineTo(W, y); d.stroke(); }
  return c;
}

// Territory outlines. Extracted so the static base can render them too.
function drawTerritoryBoundaries(auk) {
  GAME_COUNTRIES.forEach(gc => {
    const isAntarctica = gc.ckey === 'antarctica';
    if (isAntarctica && !auk) return;
    const b = gcBounds[gc.id];
    if (!b || !b.rings.length) return;
    const state = LIVE_COUNTRIES[gc.id];
    const p = state?.ownerUid ? PLAYERS[state.ownerUid] : null;
    const m = CONT[gc.ckey];

    // Draw a dashed/solid outline around all rings in this territory
    ctx.save();
    b.rings.forEach(ring => {
      ctx.beginPath(); traceRing(ring);
    });
    if (p) {
      // Owned — bright border in owner colour
      ctx.strokeStyle = `rgba(${p.r},${p.g},${p.b},0.8)`;
      ctx.lineWidth = 2.5;
      ctx.setLineDash([]);
    } else {
      // Unclaimed — dim dashed border in continent colour
      ctx.strokeStyle = m.hex + '33';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([6, 4]);
    }
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  });

  // ── DEPTH (Phase 8) ──
  // Composited here, not at the end: depth belongs to the environment, so it
  // lands on the ocean and landmasses but NOT on the continent labels, country
  // markers or soldier counts drawn below. Measured - blitting it over the top
  // dimmed the whole informational layer by ~17%.
  if (!_depthLayer) _depthLayer = buildDepthLayer();
  ctx.drawImage(_depthLayer, 0, 0);
}

/* Static base. Everything that does not animate, rasterised once.
   Keyed on the world state it depends on, so ownership changes rebuild it. */
let _baseLayer = null, _baseKey = '';
function baseKey() {
  const owners = Object.keys(LIVE_COUNTRIES).sort()
    .map(k => k + ':' + (LIVE_COUNTRIES[k]?.ownerUid || '')).join(',');
  return (isAntarcticaUnlocked() ? 'a1' : 'a0') + '|' + owners;
}
function buildBaseLayer() {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const b = c.getContext('2d');
  const prev = ctx;                 // draw helpers below write through `ctx`
  try {
    ctx = b;
    ctx.fillStyle = '#020912'; ctx.fillRect(0, 0, W, H);
    // atmosphere at its mid point - the breathing is re-applied per frame
    const a1 = ctx.createRadialGradient(W*0.3, H*0.2, 0, W*0.3, H*0.2, W*0.5);
    a1.addColorStop(0, 'rgba(91,168,255,0.0075)'); a1.addColorStop(1, 'transparent');
    ctx.fillStyle = a1; ctx.fillRect(0, 0, W, H);
    const a2 = ctx.createRadialGradient(W*0.7, H*0.7, 0, W*0.7, H*0.7, W*0.4);
    a2.addColorStop(0, 'rgba(139,92,255,0.005)'); a2.addColorStop(1, 'transparent');
    ctx.fillStyle = a2; ctx.fillRect(0, 0, W, H);
    // graticule
    ctx.strokeStyle = 'rgba(61,165,255,0.04)'; ctx.lineWidth = 0.5;
    for (let lat=-75; lat<=75; lat+=15){ const[,y]=ll2px(0,lat); ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
    for (let lon=-180; lon<=180; lon+=30){ const[x]=ll2px(lon,0); ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
    const auk = isAntarcticaUnlocked();
    // landmasses - owned ones are painted here unanimated and re-pulsed per frame
    COUNTRIES_GEO.forEach(country => {
      const gc = nameToGame[country.n];
      if (!gc) return;
      const isAnt = gc.ckey === 'antarctica';
      if (isAnt && !auk) {
        country.r.forEach(ring => { ctx.beginPath(); traceRing(ring);
          ctx.fillStyle = '#03070f'; ctx.strokeStyle = 'rgba(148,163,184,0.06)';
          ctx.lineWidth = 0.5; ctx.fill(); ctx.stroke(); });
        return;
      }
      const st = LIVE_COUNTRIES[gc.id];
      const p = st?.ownerUid ? PLAYERS[st.ownerUid] : null;
      country.r.forEach(ring => { ctx.beginPath(); traceRing(ring);
        ctx.fillStyle = p ? `rgba(${p.r},${p.g},${p.b},0.8)` : '#09162a';
        ctx.strokeStyle = p ? `rgba(${p.r},${p.g},${p.b},0.45)` : 'rgba(61,165,255,0.1)';
        ctx.lineWidth = p ? 1.0 : 0.4; ctx.fill(); ctx.stroke(); });
    });
    drawTerritoryBoundaries(auk);
    if (!_depthLayer) _depthLayer = buildDepthLayer();
    ctx.drawImage(_depthLayer, 0, 0);
  } finally { ctx = prev; }
  return c;
}

function draw(t = 0) {
  // Static base: background, atmosphere, graticule, every landmass, boundaries
  // and depth. Rebuilt only when the world state it depends on changes.
  const key = baseKey();
  if (!_baseLayer || key !== _baseKey) { _baseLayer = buildBaseLayer(); _baseKey = key; }
  ctx.clearRect(0, 0, W, H);
  ctx.drawImage(_baseLayer, 0, 0);

  // The breathing light is the only animated part of the atmosphere, so it is
  // re-applied over the base rather than making the base per-frame work.
  const breathe = 0.5 + Math.sin(t * 0.0008) * 0.1;
  const atm = ctx.createRadialGradient(W*0.3, H*0.2, 0, W*0.3, H*0.2, W*0.5);
  atm.addColorStop(0, `rgba(91,168,255,${0.015 * (breathe - 0.5) + 0.0075})`);
  atm.addColorStop(1, 'transparent');
  ctx.fillStyle = atm; ctx.fillRect(0, 0, W, H);

  const antarcticaUnlocked = isAntarcticaUnlocked();

  // ── Only owned territories animate ──
  // Unowned landmasses are already in the base and are never re-traced; this is
  // what returns the world view to full frame rate while still animating.
  COUNTRIES_GEO.forEach(country => {
    const gc = nameToGame[country.n];
    if (!gc) return;
    if (gc.ckey === 'antarctica' && !antarcticaUnlocked) return;
    const state = LIVE_COUNTRIES[gc.id];
    const p = state?.ownerUid ? PLAYERS[state.ownerUid] : null;
    if (!p) return;
    const pulse = 0.75 + Math.sin(t*0.003 + (ll2px(gc.lon||0, gc.lat||0)[0])*0.001)*0.12;
    country.r.forEach(ring => {
      ctx.beginPath(); traceRing(ring);
      ctx.fillStyle = `rgba(${p.r},${p.g},${p.b},${pulse})`;
      ctx.strokeStyle = `rgba(${p.r},${p.g},${p.b},0.45)`;
      ctx.lineWidth = 1.0;
      ctx.fill(); ctx.stroke();
    });
  });

  drawTerritoryBoundaries(antarcticaUnlocked);

  // ── Step 3: Continent name labels ──
  const CC = {northAmerica:[42,-100],southAmerica:[-20,-58],europe:[54,14],africa:[5,20],asia:[42,82],australia:[-28,134],antarctica:[-78,0]};
  Object.entries(CONT).forEach(([k,m]) => {
    const [lat,lon] = CC[k];
    const [x,y] = ll2px(lon,lat);
    const isAntarctica = k === 'antarctica';
    if (isAntarctica && !antarcticaUnlocked) {
      ctx.font = 'bold 11px Courier New';
      ctx.fillStyle = 'rgba(148,163,184,0.15)';
      ctx.textAlign = 'center';
      ctx.fillText('??? THE GATE ???', x, y);
      return;
    }
    ctx.font = 'bold 10px Courier New';
    ctx.fillStyle = m.hex + '50';
    ctx.textAlign = 'center';
    ctx.fillText(m.name.toUpperCase(), x, y);
    ctx.font = '8px Courier New';
    ctx.fillStyle = m.hex + '30';
    ctx.fillText(m.bonus, x, y + 14);
  });

  // ── Step 4: Game country markers ──
  GAME_COUNTRIES.forEach(c => {
    const isAntarctica = c.ckey === 'antarctica';
    if (isAntarctica && !antarcticaUnlocked) return;
    const [x,y] = ll2px(c.lon, c.lat);
    const state = LIVE_COUNTRIES[c.id];
    const p = state?.ownerUid ? PLAYERS[state.ownerUid] : null;
    const m = CONT[c.ckey];
    const soldiers = state?.soldiers || 0;
    const pulse = p ? 0.9 + Math.sin(t*0.004+x*0.002)*0.1 : 1;

    // Capital gets much larger presence
    const dotR = c.isCapital ? 10 : 6;

    // Glow
    if (p) {
      const g = ctx.createRadialGradient(x,y,0,x,y,(c.isCapital?28:18)*pulse);
      g.addColorStop(0, `rgba(${p.r},${p.g},${p.b},0.5)`);
      g.addColorStop(1, 'transparent');
      ctx.beginPath(); ctx.arc(x,y,(c.isCapital?28:18)*pulse,0,Math.PI*2);
      ctx.fillStyle=g; ctx.fill();
    }

    // Dot
    ctx.beginPath();
    ctx.arc(x, y, dotR, 0, Math.PI*2);
    ctx.fillStyle = p ? `rgb(${p.r},${p.g},${p.b})` : '#0a1e33';
    ctx.strokeStyle = p ? 'rgba(255,255,255,0.95)' : (m.hex + '55');
    ctx.lineWidth = c.isCapital ? 2.5 : 1.5;
    ctx.fill(); ctx.stroke();

    // Capital star
    if (c.isCapital) {
      ctx.font = 'bold 10px Arial'; ctx.fillStyle='#fff'; ctx.textAlign='center';
      ctx.fillText('★', x, y+3.5);
    }

    // Territory name — always visible, scaled by zoom
    const nameSize = c.isCapital ? 11 : 9;
    ctx.font = `${c.isCapital?'bold ':' '}${nameSize}px Courier New`;
    ctx.textAlign = 'center';
    // Text shadow
    ctx.strokeStyle = 'rgba(0,0,0,0.9)'; ctx.lineWidth = 3;
    ctx.strokeText(c.short||c.name, x, y - dotR - 6);
    ctx.fillStyle = p ? `rgb(${p.r},${p.g},${p.b})` : (m.hex + 'aa');
    ctx.fillText(c.short||c.name, x, y - dotR - 6);

    // Soldiers — shield icon + count + strength bar
    if (soldiers > 0 && p) {
      const barW = Math.max(30, Math.min(60, Math.log10(soldiers+1)*20));
      const barH = 3;
      const barX = x - barW/2;
      const barY = y + dotR + 8;
      const maxSoldiers = 2000;
      const fillPct = Math.min(1, soldiers/maxSoldiers);

      // Soldier count label
      ctx.font = '8px Courier New';
      ctx.textAlign = 'center';
      ctx.fillStyle = `rgba(${p.r},${p.g},${p.b},0.9)`;
      ctx.strokeStyle = 'rgba(0,0,0,0.8)'; ctx.lineWidth = 2;
      const soldierText = soldiers >= 1000 ? `🛡 ${(soldiers/1000).toFixed(1)}k` : `🛡 ${soldiers}`;
      ctx.strokeText(soldierText, x, barY);
      ctx.fillText(soldierText, x, barY);

      // Strength bar
      ctx.fillStyle = 'rgba(255,255,255,0.08)';
      ctx.fillRect(barX, barY+3, barW, barH);
      ctx.fillStyle = `rgba(${p.r},${p.g},${p.b},0.8)`;
      ctx.fillRect(barX, barY+3, barW*fillPct, barH);
    }
  });

  // ── COMPOSITE: exploration state, entry transition ──
  // (depth is composited earlier, under the markers - see below)
  if (isExplorationLocked()) {
    if (!_lockLayer) _lockLayer = buildLockLayer();
    ctx.drawImage(_lockLayer, 0, 0);
    // a slow sweep, so the lock reads as scanning rather than as a dead screen
    const sy = ((t * 0.06) % (H + 260)) - 130;
    const sg = ctx.createLinearGradient(0, sy - 130, 0, sy + 130);
    sg.addColorStop(0, 'transparent');
    sg.addColorStop(0.5, 'rgba(91,168,255,0.055)');
    sg.addColorStop(1, 'transparent');
    ctx.fillStyle = sg; ctx.fillRect(0, sy - 130, W, 260);
  }

  // Entry transition - the world resolves in rather than snapping on.
  if (_swEnterFrom !== null) {
    const k = Math.min(1, (t - _swEnterFrom) / 900);
    if (k >= 1) { _swEnterFrom = null; }
    else {
      ctx.fillStyle = `rgba(2,6,14,${(1 - k) * 0.92})`;
      ctx.fillRect(0, 0, W, H);
      const bandY = H * (1 - k);
      const bg = ctx.createLinearGradient(0, bandY - 90, 0, bandY + 90);
      bg.addColorStop(0, 'transparent');
      bg.addColorStop(0.5, `rgba(91,168,255,${0.16 * (1 - k)})`);
      bg.addColorStop(1, 'transparent');
      ctx.fillStyle = bg; ctx.fillRect(0, bandY - 90, W, 180);
    }
  }
}
// Set when the view becomes active, so entering the world is a transition.
let _swEnterFrom = null;
let _swEnterRaf = 0;
/* The transition must drive its own frames. animate() only runs while the
   parent has marked the view active, and a single draw would otherwise leave
   the 0.92-alpha entry wash painted over the map permanently. This loop is
   bounded by the transition itself and stops as soon as it completes, so no
   permanent render loop is added. */
function startEnterTransition() {
  _swEnterFrom = performance.now();
  if (_swEnterRaf) cancelAnimationFrame(_swEnterRaf);
  const step = (t) => {
    draw(t);
    _swEnterRaf = (_swEnterFrom !== null) ? requestAnimationFrame(step) : 0;
  };
  _swEnterRaf = requestAnimationFrame(step);
}

let lastT = 0;
// Presentation lifecycle. The parent keeps this iframe loaded permanently, so
// without this the canvas repainted 2048x1024 at 30fps forever behind every
// other view, capping the whole app at ~25fps once World had been opened once.
let swActive = false;
let swRafQueued = false;
window.addEventListener('message', (e) => {
  if (e.source !== window.parent || e.data?.type !== 'setActive') return;
  const next = !!e.data.active;
  if (next === swActive) return;
  swActive = next;
  if (swActive) startEnterTransition();
  if (swActive && !swRafQueued) { swRafQueued = true; requestAnimationFrame(animate); }
});
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && swActive && !swRafQueued) {
    swRafQueued = true; requestAnimationFrame(animate);
  }
});
function animate(t) {
  swRafQueued = false;
  if (!swActive || document.hidden) return;   // idle: no rAF rescheduled
  swRafQueued = true;
  requestAnimationFrame(animate);
  if (t-lastT < 33) return; // ~30fps for world — alive but not expensive
  lastT = t;
  draw(t);
}

// ── LOAD FROM PARENT ──
let CURRENT_GC = null;
const PARENT_ORIGIN = location.ancestorOrigins?.[0] || '*';

function loadFromParent() {
  return new Promise(resolve => {
    const timeout = setTimeout(() => { console.log('Shadow World: timeout'); resolve(); }, 3000);
    window.addEventListener('message', (e) => {
      // Security: only accept from parent
      if (e.source !== window.parent) return;
      if (e.data?.type === 'shadowWorldData') {
        clearTimeout(timeout);
        LIVE_COUNTRIES = e.data.countries || {};
        LIVE_POOL = e.data.pool || {};
        CURRENT_UID = e.data.currentUid || null;
        EXPLORATION_UNLOCKS_AT = e.data.explorationUnlocksAt || null;
        Object.assign(PLAYERS, e.data.players || {});
        resolve();
      }
      if (e.data?.type === 'focusContinent') {
        const CONT_CENTERS = {northAmerica:[42,-100],southAmerica:[-20,-58],europe:[54,14],africa:[5,20],asia:[42,82],australia:[-28,134],antarctica:[-78,0]};
        const [lat,lon] = CONT_CENTERS[e.data.ckey]||[0,0];
        const [cx,cy] = ll2px(lon,lat);
        const mapEl = document.getElementById('map-area');
        sc = 1.8; tx = mapEl.clientWidth/2-cx*sc; ty = mapEl.clientHeight/2-cy*sc; applyT();
      }
    });
    window.parent.postMessage({ type:'requestShadowWorldData' }, PARENT_ORIGIN);
  // The parent creates this iframe lazily and posts setActive immediately, so
  // that message can arrive before this module attaches its listener and be
  // lost - leaving the canvas drawn once and never animating. Announce
  // readiness and let the parent restate the current view.
  window.parent.postMessage({ type:'shadowWorldReady' }, PARENT_ORIGIN);
  });
}

loadFromParent().then(() => {
  setP(100);
  setTimeout(() => {
    const loadEl = document.getElementById('load');
    if (loadEl) loadEl.style.display = 'none';
    updateGateLock();
    showConquestLockOverlay();
  }, 300);
  // Paint one frame so the map is ready, then stay idle until activated.
  requestAnimationFrame((t) => { draw(t); });
});

function showConquestLockOverlay() {
  // Remove any existing overlay
  document.getElementById('conquest-lock-overlay')?.remove();
  if (!isExplorationLocked()) return;

  const overlay = document.createElement('div');
  overlay.id = 'conquest-lock-overlay';

  let tickInterval = null;

  function fmt(secs) {
    const d = Math.floor(secs / 86400);
    const h = Math.floor((secs % 86400) / 3600);
    const m = Math.floor((secs % 3600) / 60);
    const s = secs % 60;
    return d > 0
      ? `${d}d ${h}h ${m}m ${String(s).padStart(2,'0')}s`
      : `${h}h ${m}m ${String(s).padStart(2,'0')}s`;
  }

  function update() {
    const secs = explorationSecsRemaining();
    if (secs <= 0) {
      clearInterval(tickInterval);
      overlay.remove();
      return;
    }
    const el = document.getElementById('clo-countdown');
    if (el) el.textContent = fmt(secs);
  }

  overlay.innerHTML = `
    <div class="clo-inner">
      <div class="clo-system">◈ THE SYSTEM ◈</div>
      <div class="clo-sword">⚔</div>
      <div class="clo-title">BUILD YOUR ARMY</div>

      <div class="clo-timer-wrap">

      </div>
      <div class="clo-pillars">

        <div class="clo-sep">·</div>

        <div class="clo-sep">·</div>
        <div class="clo-pillar">Every territory<br><span>is power</span></div>
      </div>
    </div>`;

  document.body.appendChild(overlay);
  tickInterval = setInterval(update, 1000);
}

// ── PAN + ZOOM ──
let tx=0,ty=0,sc=1;
function applyT(){canvas.style.transformOrigin='0 0';canvas.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`;}
function resetView(){
  const m=document.getElementById('map-area');
  sc=Math.min(m.clientWidth/W,m.clientHeight/H);
  tx=(m.clientWidth-W*sc)/2; ty=(m.clientHeight-H*sc)/2; applyT();
}
resetView(); window.resetView=resetView;
window.doZoom=d=>{const ns=Math.max(0.4,Math.min(6,sc+d));tx=innerWidth/2-(innerWidth/2-tx)*(ns/sc);ty=innerHeight/2-(innerHeight/2-ty)*(ns/sc);sc=ns;applyT();};

const wrap=document.getElementById('map-area');
// Pan, zoom and tap belong to the map only. The panel, planner and buttons sit inside #map-area too, and
// these handlers used to swallow their touches (no scrolling the panel, no typing the amount, and a tap
// on Deploy re-opened the territory under it, resetting the number to 10).
const offMap = e => !!e.target.closest?.('#panel,#panel-backdrop,#planner,#zb,button,input,a,#conquest-lock-overlay');
wrap.addEventListener('wheel',e=>{if(offMap(e))return;e.preventDefault();const ns=Math.max(0.4,Math.min(6,sc+(e.deltaY<0?0.15:-0.15)));tx=e.clientX-(e.clientX-tx)*(ns/sc);ty=e.clientY-(e.clientY-ty)*(ns/sc);sc=ns;applyT();},{passive:false});
let drag=false,ds={x:0,y:0},dt={x:0,y:0},moved=false,pinch=false;
wrap.addEventListener('mousedown',e=>{if(offMap(e))return;drag=true;moved=false;ds={x:e.clientX,y:e.clientY};dt={x:tx,y:ty};wrap.classList.add('drag');});
wrap.addEventListener('mousemove',e=>{if(drag){const dx=e.clientX-ds.x,dy=e.clientY-ds.y;if(Math.abs(dx)+Math.abs(dy)>4)moved=true;tx=dt.x+dx;ty=dt.y+dy;applyT();}if(!offMap(e))updateTT(e.clientX,e.clientY);});

wrap.addEventListener('touchmove',e=>{if(!drag&&!pinch)return;e.preventDefault();if(e.touches.length===1&&drag){const t=e.touches[0],dx=t.clientX-ds.x,dy=t.clientY-ds.y;if(Math.abs(dx)+Math.abs(dy)>4)moved=true;tx=dt.x+dx;ty=dt.y+dy;applyT();}if(e.touches.length===2){const d2=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);const ns=Math.max(0.4,Math.min(6,sc+(d2-ld)*0.005));const cx=(e.touches[0].clientX+e.touches[1].clientX)/2,cy=(e.touches[0].clientY+e.touches[1].clientY)/2;tx=cx-(cx-tx)*(ns/sc);ty=cy-(cy-ty)*(ns/sc);sc=ns;ld=d2;applyT();}},{passive:false});

    // Also hide the deploy row
    deployRow.style.display = 'none';
  } else if (!state) {
    pa.innerHTML = myPool>0
      ? `<button class="pb bd" onclick="document.getElementById('deploy-input').focus()">⚑ Deploy to Claim</button>`
      : `<button class="pb bg" style="opacity:.5;pointer-events:none;">⚑ Train to Claim</button>`;
  } else if (isOwner) {
    pa.innerHTML = `
      <div style="font-family:var(--font-mono);font-size:9px;color:rgba(91,168,255,.35);letter-spacing:.1em;margin-bottom:8px;">◈ WITHDRAW SOLDIERS</div>
      <div style="display:flex;gap:8px;align-items:center;">
        <input type="number" id="withdraw-input" min="1" max="${soldiers}" value="${Math.min(10,soldiers)}" inputmode="numeric"
          style="width:80px;background:rgba(255,255,255,.04);border:1px solid rgba(91,168,255,.2);border-radius:6px;color:#F2F5FA;padding:7px 10px;font-family:'Courier New',monospace;font-size:13px;" />
        <button class="pb br" onclick="withdrawFromCountry(CURRENT_GC, parseInt(document.getElementById('withdraw-input').value)||1)"
          style="flex:1;">⬆ Withdraw to Pool</button>
      </div>
      <div style="font-size:10px;color:rgba(91,168,255,.3);margin-top:6px;">${soldiers} stationed · withdraw to redeploy elsewhere</div>`;
  } else {
    pa.innerHTML = `<button class="pb ba" onclick="declareWar('${c.id}','${state.ownerUid}')">⚔ Declare War on ${plEsc(ownerP?.name||'?')}</button>`;
  }

  const plRow = document.getElementById('planner-row');
  const canPlan = myPool > 0 && !isExplorationLocked() && c.ckey !== 'antarctica';
  plRow.style.display = canPlan ? 'block' : 'none';
  document.getElementById('open-planner').onclick = () => openPlanner(c.ckey, c.id);

  document.getElementById('panel').classList.add('open');
  document.getElementById('panel-backdrop').classList.add('open');
}

// ── DEPLOY PLANNER ──
// A continent view: tap a territory on the map (or its chip), load soldiers, deploy several at once.
// It sends the same 'deployToCountry' message as the quick deploy, one territory at a time, waiting for the
// parent's 'deployDone' so each write sees the pool left by the one before.
const PL_BOX = { northAmerica:[-170,-50,5,84], southAmerica:[-84,-33,-57,14], europe:[-26,62,33,72], africa:[-20,52,-36,38], asia:[26,150,-12,78], australia:[110,180,-48,2] };
let PL = null; // { ckey, terr:[gc], add:{id:n}, sel:id, step }
function plHeld(gc) {
  const st = LIVE_COUNTRIES[gc.id];
  if (!st || !st.ownerUid) return 'free';
  return st.ownerUid === CURRENT_UID ? 'me' : 'foe';
}
function plPool() { const m = CONT[PL.ckey]; return (LIVE_POOL[CURRENT_UID]||{})[m.armyKey]||0; }
function plLeft() { return plPool() - Object.values(PL.add).reduce((a,b)=>a+b,0); }
function plSet(id, v) {
  const others = Object.entries(PL.add).reduce((a,[k,n])=>a+(k===id?0:n),0);
  PL.add[id] = Math.max(0, Math.min(plPool()-others, v));
}
function plEsc(t) { return String(t).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
function plMapSvg() {
  const box = PL_BOX[PL.ckey];
  if (!box) return '';
  const [lon0,lon1,lat0,lat1] = box;
  const mid = (lat0+lat1)/2, cosM = Math.max(.35, Math.cos(mid*Math.PI/180));
  let s = 360/((lon1-lon0)*cosM);
  s = Math.min(s, 300/(lat1-lat0));
  const w = (lon1-lon0)*cosM*s, hgt = (lat1-lat0)*s, ox = (360-w)/2;
  const px = (lon,lat) => [ox+(Math.max(lon0,Math.min(lon1,lon))-lon0)*cosM*s, (lat1-Math.max(lat0,Math.min(lat1,lat)))*s];
  let paths = '', labels = '';
  PL.terr.forEach(gc => {
    const b = gcBounds[gc.id];
    if (!b || !b.rings.length) return;
    let d = '';
    b.rings.forEach(ring => {
      if (!ring.some(([lo,la]) => lo>=lon0&&lo<=lon1&&la>=lat0&&la<=lat1)) return;
      const step = ring.length>400 ? 3 : ring.length>120 ? 2 : 1;
      let seg = '';
      for (let i=0;i<ring.length;i+=step) { const [x,y]=px(ring[i][0],ring[i][1]); seg += (seg?'L':'M')+x.toFixed(1)+' '+y.toFixed(1); }
      d += seg+'Z';
    });
    if (!d) return;
    const own = plHeld(gc), n = PL.add[gc.id]||0;
    const cls = (own==='foe'?'foe':(n>0?'add':own)) + (PL.sel===gc.id?' sel':'');
    paths += `<g class="${cls}" data-id="${gc.id}"><path d="${d}"></path></g>`;
    const [lx,ly] = px(gc.lon, gc.lat), st = LIVE_COUNTRIES[gc.id], tot = (st?.soldiers||0)+n;
    labels += `<text class="pl-lab" x="${lx.toFixed(1)}" y="${(ly-9).toFixed(1)}">${gc.isCapital?'★ ':''}${plEsc(gc.short)}</text><text class="pl-badge" x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}">${tot||'+'}</text>`;
  });
  return `<svg viewBox="0 0 360 ${Math.round(hgt)}" role="img" aria-label="Map of ${plEsc(CONT[PL.ckey].name)}. Tap a territory to load soldiers.">${paths}${labels}</svg>`;
}
function renderPlanner() {
  const m = CONT[PL.ckey], pool = plPool(), left = plLeft();
  const sel = PL.terr.find(g => g.id===PL.sel) || PL.terr[0];
  const heldNow = PL.terr.filter(g => plHeld(g)==='me').length;
  const heldAfter = PL.terr.filter(g => plHeld(g)==='me' || (plHeld(g)==='free' && (PL.add[g.id]||0)>0)).length;
  const used = pool-left, n = Object.values(PL.add).filter(v=>v>0).length;
  const mapSvg = plMapSvg();
  const chips = PL.terr.map(g => {
    const own = plHeld(g), st = LIVE_COUNTRIES[g.id], tot = (st?.soldiers||0)+(PL.add[g.id]||0);
    return `<button type="button" class="pl-chip ${own==='foe'?'foe':own==='me'?'me':''} ${g.id===sel.id?'sel':''}" data-id="${g.id}">${g.isCapital?'★ ':''}${plEsc(g.short)} · ${tot}</button>`;
  }).join('');
  const own = plHeld(sel), st = LIVE_COUNTRIES[sel.id], stationed = st?.soldiers||0, add = PL.add[sel.id]||0;
  const fan = sel.place && sel.place!==sel.name ? `${plEsc(sel.name.toUpperCase())} · ` : '';
  let card;
  if (own==='foe') {
    const owner = PLAYERS[st.ownerUid];
    card = `<div class="pl-card foe"><div><div class="pl-tn">${sel.isCapital?'★ ':''}${plEsc(sel.place)}<small>${fan}${plEsc((owner?.name||'?').toUpperCase())}</small></div><div class="pl-tg"><b>${stationed.toLocaleString()}</b> stationed · home advantage 1.2×</div></div><div></div><div class="pl-foot"><span style="color:#ff6b82;font-size:14px;">Can't deploy onto enemy ground</span><button type="button" class="pl-war" id="pl-war">⚔ Declare war</button></div></div>`;
  } else {
    const max = Math.max(20, stationed+add);
    card = `<div class="pl-card ${own==='me'?'':'free'}"><div><div class="pl-tn">${sel.isCapital?'★ ':''}${plEsc(sel.place)}<small>${fan}${own==='me'?'YOURS':'FREE · 1 SOLDIER CLAIMS IT'}</small></div><div class="pl-tg"><b>${stationed.toLocaleString()}</b>${add?` → <i>${(stationed+add).toLocaleString()}</i>`:''} stationed</div></div><div class="pl-ctl"><button type="button" data-d="-1" aria-label="Remove soldiers">−</button><output>${add}</output><button type="button" data-d="1" aria-label="Add soldiers">+</button></div><div class="pl-bar"><div class="a" style="width:${stationed/max*100}%"></div><div class="n" style="width:${add/max*100}%"></div></div><div class="pl-foot"><div class="pl-step">${[1,5,10].map(v=>`<button type="button" data-step="${v}" class="${PL.step===v?'on':''}">×${v}</button>`).join('')}<button type="button" data-max="1">Max</button></div></div></div>`;
  }
  const mineAfter = PL.terr.map(g => ({g, v:(LIVE_COUNTRIES[g.id]?.soldiers||0)+(PL.add[g.id]||0), ok: plHeld(g)==='me' || (plHeld(g)==='free' && (PL.add[g.id]||0)>0)})).filter(x=>x.ok);
  const weak = mineAfter.length ? mineAfter.reduce((a,b)=>b.v<a.v?b:a) : null;
  const foes = PL.terr.filter(g => plHeld(g)==='foe');
  const need = 6-heldAfter;
  const dom = heldAfter===6 ? '★ Dominated' : need>0 ? (foes.length ? `needs ${need} more, incl. ${plEsc(foes[0].short)}` : `needs ${need} more`) : '';
  document.getElementById('pl-sheet').innerHTML = `
    <div class="pl-top" style="--pl:${m.hex}"><div class="pl-crest">${m.icon}</div><div><div class="pl-cn">${plEsc(m.name)}</div><div class="pl-cs">${plEsc(m.stat)} · ${heldNow} of 6 held</div></div><div class="pl-res"><b>${left.toLocaleString()}</b><span>LEFT TO PLACE</span></div><button type="button" class="pl-x" id="pl-close" aria-label="Close planner">✕</button></div>
    <div class="pl-pre"><button type="button" data-pre="claim">Claim all free</button><button type="button" data-pre="even">Spread evenly</button><button type="button" data-pre="weak">Reinforce weakest</button><button type="button" data-pre="clear">Clear</button></div>
    ${mapSvg?`<div class="pl-map">${mapSvg}</div><div class="pl-key"><span><i style="background:rgba(245,158,11,.7)"></i>Yours</span><span><i style="background:rgba(91,168,255,.35)"></i>Free</span><span><i style="background:rgba(255,107,130,.7)"></i>Rival</span><span><i style="background:rgba(255,214,107,.8)"></i>Adding</span></div>`:''}
    <div class="pl-chips">${chips}</div>
    ${card}
    <div class="pl-sum"><div class="pl-row"><span>Countries held</span><em class="${heldAfter>heldNow?'g':''}">${heldNow}/6 → ${heldAfter}/6</em></div><div class="pl-row"><span>Weakest garrison</span><em>${weak?plEsc(weak.g.short)+' · '+weak.v.toLocaleString():'—'}</em></div><div class="pl-row"><span>Domination</span><em>${dom}</em></div></div>
    <button type="button" class="pl-go" id="pl-go" ${used?'':'disabled'}>${used?`Deploy ${used.toLocaleString()} to ${n} ${n===1?'territory':'territories'}`:'Place soldiers'}</button>`;
}
function openPlanner(ckey, selId) {
  const terr = GAME_COUNTRIES.filter(g => g.ckey===ckey);
  PL = { ckey, terr, add:{}, sel:selId, step:5 };
  terr.forEach(g => PL.add[g.id]=0);
  closePanel();
  document.getElementById('planner').hidden = false;
  renderPlanner();
}
function closePlanner() { document.getElementById('planner').hidden = true; PL = null; }
function plPreset(kind) {
  const pool = plPool();
  PL.terr.forEach(g => PL.add[g.id]=0);
  const free = PL.terr.filter(g => plHeld(g)==='free'), mine = PL.terr.filter(g => plHeld(g)==='me');
  if (kind==='claim') { free.slice(0,pool).forEach(g => PL.add[g.id]=1); }
  else if (kind==='even') { const ids = free.concat(mine); if (ids.length) { const each = Math.floor(pool/ids.length); ids.forEach(g => PL.add[g.id]=each); } }
  else if (kind==='weak' && mine.length) { const w = mine.reduce((a,b)=>((LIVE_COUNTRIES[b.id]?.soldiers||0)<(LIVE_COUNTRIES[a.id]?.soldiers||0)?b:a)); PL.add[w.id]=Math.min(pool,Math.max(1,Math.round(pool*.25))); PL.sel=w.id; }
  renderPlanner();
}
let PL_WAIT = null;
function plSendOne(gc, amount) {
  const m = CONT[gc.ckey];
  return new Promise(resolve => {
    const t = setTimeout(() => { PL_WAIT = null; resolve(false); }, 8000);
    PL_WAIT = ok => { clearTimeout(t); PL_WAIT = null; resolve(ok); };
    window.parent.postMessage({ type:'deployToCountry', gcId:gc.id, armyKey:m.armyKey, amount, ckey:gc.ckey }, PARENT_ORIGIN);
  });
}
async function plDeploy() {
  if (!PL) return;
  if (isExplorationLocked()) { swNotify('⚠ Exploration locked — wait for the countdown', '#ff3d5a'); return; }
  const m = CONT[PL.ckey], jobs = PL.terr.filter(g => (PL.add[g.id]||0)>0 && plHeld(g)!=='foe');
  const total = jobs.reduce((a,g)=>a+PL.add[g.id],0);
  if (!jobs.length || total>plPool()) return;
  const btn = document.getElementById('pl-go'); if (btn) { btn.disabled = true; btn.textContent = 'Deploying…'; }
  let placed = 0, failed = 0;
  for (const g of jobs) {
    const amount = PL.add[g.id];
    const ok = await plSendOne(g, amount);
    if (!ok) { failed++; continue; }
    placed += amount;
    if (!LIVE_COUNTRIES[g.id]) LIVE_COUNTRIES[g.id] = { ownerUid:CURRENT_UID, soldiers:0 };
    else if (!LIVE_COUNTRIES[g.id].ownerUid) LIVE_COUNTRIES[g.id].ownerUid = CURRENT_UID;
    LIVE_COUNTRIES[g.id].soldiers = (LIVE_COUNTRIES[g.id].soldiers||0) + amount;
    if (!LIVE_POOL[CURRENT_UID]) LIVE_POOL[CURRENT_UID] = {};
    LIVE_POOL[CURRENT_UID][m.armyKey] = Math.max(0, ((LIVE_POOL[CURRENT_UID][m.armyKey])||0) - amount);
  }
  updateGateLock();
  swNotify(failed ? `⚠ ${placed.toLocaleString()} deployed, ${failed} territor${failed===1?'y':'ies'} failed — check your reserve` : `⚑ ${placed.toLocaleString()} soldiers deployed across ${jobs.length} ${jobs.length===1?'territory':'territories'}`, failed?'#ff3d5a':(PLAYERS[CURRENT_UID]?.hex||'#61a5ff'));
  closePlanner();
}
document.getElementById('planner').addEventListener('click', e => {
  if (!PL) return;
  if (e.target.id==='planner' || e.target.closest('#pl-close')) { closePlanner(); return; }
  const g = e.target.closest('g[data-id]'), chip = e.target.closest('.pl-chip');
  if (g || chip) { PL.sel = (g||chip).dataset.id; renderPlanner(); return; }
  const pre = e.target.closest('[data-pre]'); if (pre) { plPreset(pre.dataset.pre); return; }
  const step = e.target.closest('[data-step]'); if (step) { PL.step = +step.dataset.step; renderPlanner(); return; }
  if (e.target.closest('[data-max]')) { plSet(PL.sel, plLeft()+(PL.add[PL.sel]||0)); renderPlanner(); return; }
  const d = e.target.closest('button[data-d]'); if (d) { plSet(PL.sel, (PL.add[PL.sel]||0)+(+d.dataset.d)*PL.step); renderPlanner(); return; }
  if (e.target.closest('#pl-war')) { const gc = PL.terr.find(x=>x.id===PL.sel); const st = LIVE_COUNTRIES[gc.id]; closePlanner(); declareWar(gc.id, st.ownerUid); return; }
  if (e.target.closest('#pl-go')) plDeploy();
});

function deployToCountry(c, amount) {
  if (isExplorationLocked()) { swNotify('⚠ Exploration locked — wait for the countdown', '#ff3d5a'); return; }
  const m = CONT[c.ckey];
  const myPool = (LIVE_POOL[CURRENT_UID]||{})[m.armyKey]||0;
  if (amount<=0||amount>myPool) {
    swNotify(`⚠ Insufficient forces — you have ${myPool} ${m.armyKey} soldiers`, '#ff3d5a');
    return;
  }
  // Block deploy onto enemy territory — must Declare War first
  const state = LIVE_COUNTRIES[c.id];
  if (state?.ownerUid && state.ownerUid !== CURRENT_UID) {
    swNotify('⚠ Cannot deploy to enemy territory — Declare War first', '#ff3d5a');
    return;
  }
  // Send to parent
  window.parent.postMessage({ type:'deployToCountry', gcId:c.id, armyKey:m.armyKey, amount, ckey:c.ckey }, PARENT_ORIGIN);
  // Optimistic update
  if (!LIVE_COUNTRIES[c.id]) LIVE_COUNTRIES[c.id]={ownerUid:CURRENT_UID,soldiers:0};
  else if (!LIVE_COUNTRIES[c.id].ownerUid) LIVE_COUNTRIES[c.id].ownerUid=CURRENT_UID;
  LIVE_COUNTRIES[c.id].soldiers=(LIVE_COUNTRIES[c.id].soldiers||0)+amount;
  if (!LIVE_POOL[CURRENT_UID]) LIVE_POOL[CURRENT_UID]={};
  LIVE_POOL[CURRENT_UID][m.armyKey]=Math.max(0,myPool-amount);
  swNotify(`⚑ ${amount.toLocaleString()} soldiers deployed to ${c.place||c.name}`, PLAYERS[CURRENT_UID]?.hex||'#61a5ff');
  updateGateLock();
  closePanel();
}

function withdrawFromCountry(c, amount) {
  const m = CONT[c.ckey];
  const stationed = LIVE_COUNTRIES[c.id]?.soldiers || 0;
  if (amount <= 0 || amount > stationed) {
    swNotify(`⚠ Only ${stationed} soldiers stationed here`, '#ff3d5a');
    return;
  }
  window.parent.postMessage({ type:'withdrawFromCountry', gcId:c.id, armyKey:m.armyKey, amount, ckey:c.ckey }, PARENT_ORIGIN);
  // Optimistic update
  LIVE_COUNTRIES[c.id].soldiers = Math.max(0, stationed - amount);
  if (!LIVE_POOL[CURRENT_UID]) LIVE_POOL[CURRENT_UID] = {};
  LIVE_POOL[CURRENT_UID][m.armyKey] = (LIVE_POOL[CURRENT_UID][m.armyKey] || 0) + amount;
  swNotify(`⬆ ${amount.toLocaleString()} soldiers withdrawn to pool`, PLAYERS[CURRENT_UID]?.hex||'#61a5ff');
  updateGateLock();
  closePanel();
}

function declareWar(gcId, defenderUid) {
  if (isExplorationLocked()) { swNotify('⚠ Exploration locked — wait for the countdown', '#ff3d5a'); return; }
  window.parent.postMessage({ type:'shadowWorldDeclareWar', gcId, defenderUid }, PARENT_ORIGIN);
  swNotify('⚔ War declared — Gate Duel initiated', '#ff3d5a');
  closePanel();
}

window.closePanel = () => {
  document.getElementById('panel').classList.remove('open');
  document.getElementById('panel-backdrop').classList.remove('open');
};

// Stop panel touches from reaching the map pan/zoom listeners
['touchstart','touchmove','touchend','mousedown','mousemove','mouseup','click'].forEach(evt => {
  document.getElementById('panel').addEventListener(evt, e => e.stopPropagation(), { passive: false });
  document.getElementById('panel-backdrop').addEventListener(evt, e => e.stopPropagation(), { passive: false });
});
window.addEventListener('resize', resetView);

// Listen for continent focus from parent
window.addEventListener('message', (e) => {
  if (e.source !== window.parent) return;
  if (e.data?.type === 'deployDone') { if (PL_WAIT) PL_WAIT(!!e.data.ok); return; }
  if (e.data?.type === 'focusContinent') {
    const CC={northAmerica:[42,-100],southAmerica:[-20,-58],europe:[54,14],africa:[5,20],asia:[42,82],australia:[-28,134],antarctica:[-78,0]};
    const [lat,lon]=CC[e.data.ckey]||[0,0];
    const [cx,cy]=ll2px(lon,lat);
    const m=document.getElementById('map-area');
    sc=1.8; tx=m.clientWidth/2-cx*sc; ty=m.clientHeight/2-cy*sc; applyT();
  }
});
</script>
